    ctx.globalAlpha = 1;
  }
  if (vis.prmClosed.size){
    ctx.fillStyle = c.closed; ctx.globalAlpha = 0.6;
    for (const p of vis.prmClosed.values()){
      if (!rectInView(p.x,p.y,1,1,view)) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 当前扩展点
  if (vis.current){
    ctx.fillStyle = c.current;
    ctx.beginPath(); ctx.arc(vis.current.x, vis.current.y, 5, 0, 7); ctx.fill();
  }
  // 蚁群蚂蚁(A 群紫 / B 群橙)
  if (algo && algo.id === 'aco' && algo.antsA){
    const groups = [ [algo.antsA, '#8a4baf'], [algo.antsB, '#d9832e'] ];
    for (const [ants, color] of groups){
      ctx.fillStyle = color;
      for (const ant of ants){
        if (ant.done) continue;
        const cc = grid.cellCenter(ant);
        if (!rectInView(cc.x,cc.y,1,1,view)) continue;
        ctx.beginPath(); ctx.arc(cc.x, cc.y, 3.5, 0, 7); ctx.fill();
      }
    }
  }
  // 最终路径
  if (vis.path.length >= 2){
    ctx.strokeStyle = c.path; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(vis.path[0].x, vis.path[0].y);
    for (let i=1;i<vis.path.length;i++){
      if (!rectInView(vis.path[i].x, vis.path[i].y, 1, 1, view)) continue;
      ctx.lineTo(vis.path[i].x, vis.path[i].y);
    }
    ctx.stroke();
  }
}
function drawCar(ctx){
  if (!car) return;
  const flash = (mode === 'failed' && car.collided) && (performance.now()-flashStart < 1000) && (Math.floor(performance.now()/100)%2 === 0);
  const corners = obbCorners(car.x, car.y, car.theta, CAR_L, CAR_W);
  ctx.fillStyle = flash ? COLORS.flash : COLORS.car;
  ctx.beginPath(); ctx.moveTo(corners[0][0],corners[0][1]);
  for (const p of corners) ctx.lineTo(p[0],p[1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = COLORS.carEdge; ctx.lineWidth = 1.5; ctx.stroke();
  // 车轮
  function wheel(off, ang){
    const wx = car.x + Math.cos(car.theta)*off, wy = car.y + Math.sin(car.theta)*off;
    ctx.save(); ctx.translate(wx,wy); ctx.rotate(ang);
    ctx.fillStyle = COLORS.wheel; ctx.fillRect(-3,-8,6,16);
    ctx.restore();
  }
  wheel(WHEELBASE/2, car.theta + car.delta);
  wheel(-WHEELBASE/2, car.theta);
  // 车头指示
  const nx = car.x + Math.cos(car.theta)*(CAR_L/2+6), ny = car.y + Math.sin(car.theta)*(CAR_L/2+6);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(nx,ny,3,0,7); ctx.fill();
}
function render(){
  c2.fillStyle = COLORS.outside; c2.fillRect(0,0,vw,vh);
  c2.save();
  c2.translate(vw/2, vh/2);
  c2.scale(cam.scale, cam.scale);
  c2.translate(-cam.x, -cam.y);
  const view = {
    x0: (0-vw/2)/cam.scale + cam.x, x1: (vw-vw/2)/cam.scale + cam.x,
    y0: (0-vh/2)/cam.scale + cam.y, y1: (vh-vh/2)/cam.scale + cam.y
  };
  // 世界背景
  c2.fillStyle = COLORS.bg; c2.fillRect(0,0,W,H);
  // 网格线
  if (cam.scale >= 0.8){
    c2.strokeStyle = COLORS.gridLine; c2.lineWidth = 1;
    c2.beginPath();
    for (let x=GRID;x<W;x+=GRID){ if (x<view.x0||x>view.x1) continue; c2.moveTo(x,Math.max(view.y0,0)); c2.lineTo(x,Math.min(view.y1,H)); }
    for (let y=GRID;y<H;y+=GRID){ if (y<view.y0||y>view.y1) continue; c2.moveTo(Math.max(view.x0,0),y); c2.lineTo(Math.min(view.x1,W),y); }
    c2.stroke();
  }
  c2.strokeStyle = COLORS.worldBorder; c2.lineWidth = 2; c2.strokeRect(0,0,W,H);
  // 障碍物
  for (const o of world.obstacles){
    if (!rectInView(o.x,o.y,o.w,o.h,view)) continue;
    c2.fillStyle = COLORS.obstacle; c2.fillRect(o.x,o.y,o.w,o.h);
    c2.strokeStyle = COLORS.obstacleEdge; c2.lineWidth = 1; c2.strokeRect(o.x,o.y,o.w,o.h);
  }
  // 选中障碍(移动路径编辑)
  if (selectedObstacle){
    c2.strokeStyle = '#f5a623'; c2.lineWidth = 3;
    c2.strokeRect(selectedObstacle.x, selectedObstacle.y, selectedObstacle.w, selectedObstacle.h);
    if (selectedObstacle.patrol && selectedObstacle.patrol.length){
      c2.setLineDash([6,4]); c2.strokeStyle = '#f5a623'; c2.lineWidth = 1.5;
      c2.beginPath();
      c2.moveTo(selectedObstacle.x+selectedObstacle.w/2, selectedObstacle.y+selectedObstacle.h/2);
      for (const p of selectedObstacle.patrol) c2.lineTo(p.x, p.y);
      c2.stroke(); c2.setLineDash([]);
      for (const p of selectedObstacle.patrol){
        c2.beginPath(); c2.arc(p.x, p.y, 5, 0, 7);
        c2.strokeStyle = '#f5a623'; c2.lineWidth = 2; c2.stroke();
        c2.fillStyle = '#fff'; c2.fill();
      }
    }
  }
  drawAlgoLayers(c2, view);
  // 拖拽放置预览
  if (mouse.mode === 'place' && mouse.startW && mouse.curW){
    const x = Math.min(mouse.startW.x,mouse.curW.x), y = Math.min(mouse.startW.y,mouse.curW.y);
    const w = Math.abs(mouse.curW.x-mouse.startW.x), h = Math.abs(mouse.curW.y-mouse.startW.y);
    c2.strokeStyle = COLORS.current; c2.lineWidth = 1.5; c2.setLineDash([5,4]);
    c2.strokeRect(x,y,w,h); c2.setLineDash([]);
    c2.fillStyle = 'rgba(255,138,92,.15)'; c2.fillRect(x,y,w,h);
  }
  // 起点 / 终点
  c2.fillStyle = COLORS.start;
  c2.beginPath(); c2.arc(start.x,start.y,10,0,7); c2.fill();
  c2.strokeStyle = '#fff'; c2.lineWidth = 2; c2.stroke();
  c2.save(); c2.translate(goal.x,goal.y); c2.rotate(Math.PI/4);
  c2.fillStyle = COLORS.goal; c2.fillRect(-10,-10,20,20);
  c2.strokeStyle = '#fff'; c2.lineWidth = 2; c2.strokeRect(-10,-10,20,20);
  c2.restore();
  // APF 合力箭头
  if (vis.force){
    c2.strokeStyle = COLORS.force; c2.lineWidth = 3;
    c2.beginPath(); c2.moveTo(vis.force.x,vis.force.y); c2.lineTo(vis.force.x+vis.force.fx, vis.force.y+vis.force.fy); c2.stroke();
    const ang = Math.atan2(vis.force.fy, vis.force.fx);
    c2.beginPath();
    c2.moveTo(vis.force.x+vis.force.fx, vis.force.y+vis.force.fy);
    c2.lineTo(vis.force.x+vis.force.fx-9*Math.cos(ang-0.5), vis.force.y+vis.force.fy-9*Math.sin(ang-0.5));
    c2.lineTo(vis.force.x+vis.force.fx-9*Math.cos(ang+0.5), vis.force.y+vis.force.fy-9*Math.sin(ang+0.5));
    c2.closePath(); c2.fillStyle = COLORS.force; c2.fill();
  }
  drawCar(c2);
  c2.restore();
}

/* ============ 主循环 ============ */
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (t-lastT)/1000 || 0.016);
  lastT = t;
  if (mode === 'searching' && running && algo){
    const n = Math.max(1, Math.ceil(8*speedMult));
    for (let i=0;i<n;i++){
      if (algo.done) break;
      handleEvents(algo.step());
    }
    if (algo.done) afterSearchDone();
  } else if (mode === 'following'){
    acc += dt;
    while (acc >= 1/60){
      followStep(1/60);
      acc -= 1/60;
      if (mode !== 'following'){ acc = 0; break; }
    }
  }
  if (mode === 'searching' && algo && algo.metrics){
    metricsLive.expanded = algo.metrics.expanded;
    metricsLive.timeMs = performance.now() - algo.t0;
    if (performance.now() - lastMetricsRender > 200){ lastMetricsRender = performance.now(); renderMetrics(); }
  }
  // 相机跟随
  if (mode === 'following'){ cam.x = car.x; cam.y = car.y; }
  updateMovingObstacles(dt);
  render();
}

/* ============ 输入 ============ */
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { sx: e.clientX-r.left, sy: e.clientY-r.top };
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { sx, sy } = canvasPos(e);
  const before = s2w(sx,sy);
  cam.scale = clamp(cam.scale*(e.deltaY<0?1.1:1/1.1), 0.5, 3);
  const after = s2w(sx,sy);
  cam.x += before.x-after.x; cam.y += before.y-after.y;
}, { passive:false });
canvas.addEventListener('mousedown', e => {
  const { sx, sy } = canvasPos(e);
  const t = document.querySelector('input[name=tool]:checked').value;
  if (e.button === 0){
    if (t === 'patrol'){
      const w = s2w(sx,sy);
      let hit = null;
      for (let i=0;i<world.obstacles.length;i++){
        const o = world.obstacles[i];
        if (w.x>=o.x && w.x<=o.x+o.w && w.y>=o.y && w.y<=o.y+o.h){ hit = o; break; }
      }
      if (hit){
        selectedObstacle = (selectedObstacle === hit) ? null : hit;
        actionText(selectedObstacle ? '已选中障碍,点击空地添加路径点' : '已取消选中');
      } else if (selectedObstacle){
        if (!selectedObstacle.patrol) selectedObstacle.patrol = [];
        selectedObstacle.patrol.push({ x:w.x, y:w.y });
        selectedObstacle.patrolIdx = 0;
        selectedObstacle.vel = null;
        actionText('已添加路径点 #'+selectedObstacle.patrol.length+'('+w.x.toFixed(0)+','+w.y.toFixed(0)+')');
      } else {
        actionText('请先点击一个障碍物进行选择');
      }
      return;
    } else if (t === 'place'){
      mouse.down = true; mouse.panning = false; mouse.mode = 'place'; mouse.moved = false;
      mouse.startW = s2w(sx,sy); mouse.curW = null; mouse.button = 0;
    } else if (t === 'delete'){
      const w = s2w(sx,sy);
      if (deleteObstacleAt(w.x,w.y)){ actionText('已删除障碍物'); return; }
      mouse.down = true; mouse.panning = true; mouse.mode = null; mouse.moved = false;
      mouse.lastS = [sx,sy]; mouse.button = 0;
    } else {
      mouse.down = true; mouse.panning = true; mouse.mode = 'goal'; mouse.moved = false;
      mouse.lastS = [sx,sy]; mouse.button = 0;
    }
  } else {
    mouse.down = true; mouse.panning = true; mouse.mode = null; mouse.moved = false;
    mouse.lastS = [sx,sy]; mouse.button = e.button;
  }
});
canvas.addEventListener('mousemove', e => {
  if (!mouse.down) return;
  const { sx, sy } = canvasPos(e);
  if (mouse.mode === 'place'){
    mouse.curW = s2w(sx,sy);
    if (mouse.lastS && Math.abs(sx-mouse.lastS[0])+Math.abs(sy-mouse.lastS[1]) > 2) mouse.moved = true;
    if (!mouse.lastS) mouse.lastS = [sx,sy];
  } else if (mouse.panning){
    const dx = sx-mouse.lastS[0], dy = sy-mouse.lastS[1];
    if (Math.abs(dx)+Math.abs(dy) > 2) mouse.moved = true;
    cam.x -= dx/cam.scale;
    cam.y -= dy/cam.scale;
    mouse.lastS = [sx,sy];
  }
});
canvas.addEventListener('mouseup', e => {
  if (!mouse.down) return;
  const { sx, sy } = canvasPos(e);
  if (mouse.mode === 'place' && mouse.startW && mouse.curW){
    const x = Math.min(mouse.startW.x,mouse.curW.x), y = Math.min(mouse.startW.y,mouse.curW.y);
    const w = Math.abs(mouse.curW.x-mouse.startW.x), h = Math.abs(mouse.curW.y-mouse.startW.y);
    if (w >= 20 && h >= 20){
      if (placeObstacle({ x, y, w, h })) actionText('已放置障碍物');
      else actionText('放置失败:与障碍重叠或覆盖起点/终点');
    } else actionText('障碍物过小(至少 20×20)');
  } else if (mouse.mode === 'goal' && !mouse.moved){
    const w = s2w(sx,sy);
    setGoal(w.x, w.y);
  }
  mouse.down = false; mouse.panning = false; mouse.mode = null; mouse.startW = null; mouse.curW = null;
});

/* ============ UI 绑定 ============ */
algSel.addEventListener('change', () => {
  algId = algSel.value;
  if (mode === 'searching' || mode === 'following') abortRun('已切换算法,中断当前运行');
});
coverRange.addEventListener('input', () => {
  coverTarget = +coverRange.value;
  coverVal.textContent = coverTarget + '%';
});
btnRegen.addEventListener('click', () => {
  generateObstacles(coverTarget/100);
  afterWorldChange();
  actionText('已重新生成障碍物');
});
btnStart.addEventListener('click', startSearch);
btnPlay.addEventListener('click', () => {
  if (mode === 'searching' || mode === 'following'){ running = true; }
});
btnPause.addEventListener('click', () => { running = false; });
btnStep.addEventListener('click', () => {
  if (mode === 'searching' && algo && !algo.done){
    running = false;
    handleEvents(algo.step());
    if (algo.done) afterSearchDone();
  } else if (mode === 'following'){
    running = false;
    followStep(1/60);
  }
});
speedSel.addEventListener('change', () => { speedMult = +speedSel.value; });
speedRange.addEventListener('input', () => { speedVal.textContent = speedRange.value; });
steerRange.addEventListener('input', () => { steerVal.textContent = steerRange.value + '°'; });
manualChk.addEventListener('change', () => {
  manualSteer = manualChk.checked;
  steerRange.disabled = !manualSteer;
});
moveSpeedRange.addEventListener('input', () => { moveSpeedVal.textContent = moveSpeedRange.value; });
btnRandomMove.addEventListener('click', () => {
  if (!selectedObstacle){
    actionText('请先用"障碍路径"工具点击选中障碍物');
    return;
  }
  const o = selectedObstacle;
  o.patrol = null; o.patrolIdx = 0;
  o.vel = makeRandomVel();
  actionText('已设置随机移动(启用"移动障碍"后生效)');
});
btnClearPatrol.addEventListener('click', () => {
  if (selectedObstacle){
    selectedObstacle.patrol = null;
    selectedObstacle.patrolIdx = 0;
    selectedObstacle.vel = null;
    actionText('已清除选中障碍的移动设置');
  } else {
    actionText('请先选中障碍物');
  }
});
document.querySelectorAll('input[name=path]').forEach(r => r.addEventListener('change', () => { pathMode = document.querySelector('input[name=path]:checked').value; }));
btnReplan.addEventListener('click', doReplan);
btnReset.addEventListener('click', () => {
  abortRun();
  metricsHistory = [];
  renderMetrics();
  actionText('已重置');
});
btnResetStart.addEventListener('click', () => {
  resetCarToStart();
  cam.x = start.x; cam.y = start.y;
  actionText('小车已回到起点');
});
window.addEventListener('resize', () => { resizeCanvas(); layout(); });

/* ============ 初始化 ============ */
resizeCanvas();
generateObstacles(0.12);
grid.buildFromWorld();
updateCoverDisplay();
layout();
requestAnimationFrame(loop);
</script>
</body>
