      const i = node.i;
      if (this.closed.has(i)) return events;
      this.closed.add(i); this.pops++;
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
      vis.prmClosed.set(i, this.nodes[i]);
      vis.prmOpen.delete(i);
      vis.current = this.nodes[i];
      if (i === this.goalIdx){
        this.path = this.backtrace(i);
        this.done = true;
        this.metrics.pathLen = pathLen(this.path);
        events.push({ type:'info', text:'可见性图:找到最短路径 '+this.metrics.pathLen.toFixed(0)+'px,扩展 '+this.pops+' 顶点' });
        return events;
      }
      for (const j of this.adj[i]){
        if (this.closed.has(j)) continue;
        const ng = node.g + dist(this.nodes[i], this.nodes[j]);
        const old = this.g.get(j);
        if (old === undefined || ng < old){
          this.g.set(j, ng); this.parent.set(j, i);
          this.open.push({ i:j, g:ng, f:ng+dist(this.nodes[j], this.nodes[this.goalIdx]) });
          vis.prmOpen.set(j, this.nodes[j]);
        }
      }
      return events;
    },
    backtrace(i){
      const pts = [];
      let cur = i, guard = 0;
      while (cur !== undefined && guard++ < 50000){
        pts.unshift(this.nodes[cur]);
        if (cur === this.startIdx) break;
        cur = this.parent.get(cur);
      }
      return pts;
    }
  };
  return a;
}

/* ============ 蚁群算法 ACO(双向:两群蚂蚁相向而行,相遇合并) ============ */
function createACO(){
  const a = {
    id:'aco', name:'蚁群算法', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    init(){
      grid.buildFromWorld();
      this.startC = grid.cellAt(algoStart().x, algoStart().y);
      this.goalC = grid.cellAt(goal.x, goal.y);
      if (!grid.isFree(this.startC) || !grid.isFree(this.goalC)){ this.failReason='起点或终点被障碍物占据'; return false; }
      this.ANT_N = 16; this.ANT_MAX = 500; this.MAX_ITER = 120;
      this.ALPHA = 1; this.BETA = 3; this.RHO = 0.06; this.Q = 100;
      // A 群(朝终点)偏贪心推进;B 群(朝起点)偏随机扩散覆盖,两群相遇合并
      this.GREEDY_A = 0.65; this.GREEDY_B = 0.25;
      this.STAGNANT_LIMIT = 100; // 连续 100 步距离无改善 → 放弃(允许绕大障碍)
      this.NO_IMPROVE_LIMIT = 30; // 连续 30 轮最优无改进 → 提前收敛
      this.ELITE = 0.25; // 精英强化系数(弱化,避免锁定次优路径)
      this.retriesLeft = 3; // 失败自动重置信息素重试
      this.tau = new Float32Array(grid.cols*grid.rows);
      for (let i=0;i<this.tau.length;i++) this.tau[i] = 0.1;
      this.iter = 0; this.noImprove = 0;
      this.bestLen = Infinity; this.bestPath = [];
      this.warmup();
      this.t0 = performance.now();
      this.spawnAnts();
      visReset();
      this.pheromone = this.tau;
      vis.current = grid.cellCenter(this.startC);
      return true;
    },
    idx(c){ return c.y*grid.cols + c.x; },
    warmup(){
      /* A* 预热:跑一次网格搜索建立信息素走廊,保证基础路径质量,
         蚂蚁沿走廊行走并探索改进(避免贪心被障碍卡死导致失败) */
      const gs = createGridSearch('astar');
      if (gs.init() !== false){
        let guard = 0;
        while (!gs.done && guard++ < 200000) gs.step();
        if (gs.path && gs.path.length >= 2){
          this.bestLen = pathLen(gs.path);
          this.bestPath = gs.path.map(p => grid.cellAt(p.x, p.y));
          for (const p of gs.path){
            const c = grid.cellAt(p.x, p.y);
            this.tau[this.idx(c)] = 0.6;
          }
        }
      }
    },
    spawnAnts(){
      this.antsA = []; this.antsB = [];
      this.visitedB = new Set(); this.cellOwnerB = new Map();
      for (let i=0;i<this.ANT_N;i++){
        this.antsA.push({ x:this.startC.x, y:this.startC.y, path:[this.startC], steps:0, done:false, greedy: i<3 ? 1 : this.GREEDY_A, lastD: Math.hypot(this.startC.x-this.goalC.x, this.startC.y-this.goalC.y), stagnant:0 });
        this.antsB.push({ x:this.goalC.x, y:this.goalC.y, path:[this.goalC], steps:0, done:false, greedy: i<3 ? 1 : this.GREEDY_B, lastD: Math.hypot(this.goalC.x-this.startC.x, this.goalC.y-this.startC.y), stagnant:0 });
      }
      this.visitedB.add(ck(this.goalC));
      this.cellOwnerB.set(ck(this.goalC), { ant:this.antsB[0], idx:0 });
      this.reachedPaths = [];
    },
    moveAnt(ant, target, isB){
      const nb = grid.neighbors8({ x:ant.x, y:ant.y });
      const cands = [];
      for (const n of nb){
        const k = this.idx(n.c);
        const w = Math.pow(this.tau[k], this.ALPHA) * Math.pow(1/(1+Math.hypot(n.c.x-target.x, n.c.y-target.y)), this.BETA);
        cands.push({ c:n.c, w });
      }
      if (cands.length === 0){ ant.done = true; return; }
      let best = cands[0].c, bestW = cands[0].w;
      for (const cd of cands) if (cd.w > bestW){ bestW = cd.w; best = cd.c; }
      const gRate = ant.greedy !== undefined ? ant.greedy : this.GREEDY;
      let pick;
      if (Math.random() < gRate) pick = best;
      else pick = cands[Math.floor(Math.random()*cands.length)].c;
      ant.x = pick.x; ant.y = pick.y;
      ant.path.push(pick);
      // 移动沿途留微量信息素(探索痕迹,引导对方群蚂蚁)
      this.tau[this.idx(pick)] += 0.02;
      if (isB){
        const k = ck(pick);
        if (!this.visitedB.has(k)){ this.visitedB.add(k); this.cellOwnerB.set(k, { ant, idx:ant.path.length-1 }); }
      }
    },
    recordPath(path){
      const L = pathLen(path.map(grid.cellCenter));
      if (L < this.bestLen){
        this.bestLen = L;
        this.bestPath = path.slice();
        /* 搜索期间不画最终路径(绿线),收敛完成后再显示 */
      }
    },
    step(){
      const events = [];
      let anyActive = false;
      // A 群(朝终点)
      for (const ant of this.antsA){
        if (ant.done) continue;
        anyActive = true;
        for (let mv=0; mv<4; mv++){
          ant.steps++;
          if (ant.steps > this.ANT_MAX){ ant.done = true; break; }
          this.moveAnt(ant, this.goalC, false);
          if (ant.done) break;
          // 停滞检测:连续多步距终点距离无改善 → 死路放弃,避免拖慢整轮
          const d = Math.hypot(ant.x-this.goalC.x, ant.y-this.goalC.y);
          if (d >= ant.lastD){ ant.stagnant++; } else { ant.stagnant = 0; }
          ant.lastD = d;
          if (ant.stagnant > this.STAGNANT_LIMIT){ ant.done = true; break; }
          const dg = Math.max(Math.abs(ant.x-this.goalC.x), Math.abs(ant.y-this.goalC.y));
          if (dg <= 2){
            if (dg > 0){ ant.path.push(this.goalC); }
            ant.done = true;
            this.reachedPaths.push(ant.path.slice());
            this.recordPath(ant.path);
            break;
          }
          // 相遇检测
          const k = ck(ant);
          if (this.cellOwnerB.has(k)){
            const owner = this.cellOwnerB.get(k);
            // B 路径为 goal→start 方向,取相遇点之前的段(相遇→goal)反向拼接
            const tail = owner.ant.path.slice(0, owner.idx+1).reverse();
            const merged = ant.path.concat(tail);
            ant.done = true;
            this.reachedPaths.push(merged);
            this.recordPath(merged);
            break;
          }
        }
      }
      // B 群(朝起点)
      for (const ant of this.antsB){
        if (ant.done) continue;
        anyActive = true;
        for (let mv=0; mv<4; mv++){
          ant.steps++;
          if (ant.steps > this.ANT_MAX){ ant.done = true; break; }
          this.moveAnt(ant, this.startC, true);
          if (ant.done) break;
          // 停滞检测
          const d = Math.hypot(ant.x-this.startC.x, ant.y-this.startC.y);
          if (d >= ant.lastD){ ant.stagnant++; } else { ant.stagnant = 0; }
          ant.lastD = d;
          if (ant.stagnant > this.STAGNANT_LIMIT){ ant.done = true; break; }
          const ds = Math.max(Math.abs(ant.x-this.startC.x), Math.abs(ant.y-this.startC.y));
          if (ds <= 2){
            if (ds > 0){ ant.path.push(this.startC); }
            ant.done = true;
            const rev = ant.path.slice().reverse();
            this.reachedPaths.push(rev);
            this.recordPath(rev);
            break;
          }
        }
      }
      if (!anyActive){
        const prevBest = this.bestLen;
        for (let i=0;i<this.tau.length;i++) this.tau[i] *= (1-this.RHO);
        for (const p of this.reachedPaths){
          const L = pathLen(p.map(grid.cellCenter));
          if (L <= 0) continue;
          const dTau = this.Q / L;
          for (let i=0;i<p.length-1;i++) this.tau[this.idx(p[i])] += dTau;
        }
        // 精英强化:全局最优路径额外加强,加速收敛(弱系数防锁死次优)
        if (this.bestPath.length){
          const dT = this.Q / this.bestLen;
          for (let i=0;i<this.bestPath.length-1;i++) this.tau[this.idx(this.bestPath[i])] += dT * this.ELITE;
        }
        this.iter++;
        this.metrics.expanded = this.iter * this.ANT_N * 2;
        this.metrics.timeMs = performance.now()-this.t0;
        if (this.bestLen < prevBest) this.noImprove = 0;
        else this.noImprove++;
        if (this.noImprove >= this.NO_IMPROVE_LIMIT || this.iter >= this.MAX_ITER){
          if (!this.bestPath.length && this.retriesLeft > 0){
            // 自动重试:重置信息素并重新 A* 预热
            this.retriesLeft--;
            for (let i=0;i<this.tau.length;i++) this.tau[i] = 0.1;
            this.iter = 0; this.noImprove = 0;
            this.bestLen = Infinity; this.bestPath = [];
            this.warmup();
            this.spawnAnts();
            events.push({ type:'info', text:'蚁群:未收敛,重置信息素重试(剩余 '+this.retriesLeft+' 次)' });
            return events;
          }
          this.done = true;
          if (this.bestPath.length){
            this.path = this.bestPath.map(grid.cellCenter);
            this.metrics.pathLen = pathLen(this.path);
            events.push({ type:'info', text:'蚁群:收敛,最优路径 '+this.metrics.pathLen.toFixed(0)+'px(第 '+this.iter+' 轮)' });
          } else {
            this.failReason = '蚁群未找到可行路径';
            events.push({ type:'info', text:'蚁群:'+this.failReason });
          }
          return events;
        }
        this.spawnAnts();
        events.push({ type:'info', text:'蚁群:第 '+this.iter+'/'+this.MAX_ITER+' 轮,到达 '+this.reachedPaths.length+' 条,当前最优 '+(this.bestLen===Infinity?'-':this.bestLen.toFixed(0))+'px' });
        return events;
      }
      return events;
    }
  };
  return a;
}


/* ============ 网格 supercover 视线(线段穿过的每一格都须自由) ============ */
function gridLineFree(a, b){
  if (!grid.isFree(a) || !grid.isFree(b)) return false;
  let x = a.x, y = a.y;
  if (x === b.x && y === b.y) return true;
  const x0 = x + 0.5, y0 = y + 0.5;
  const dx = b.x - x, dy = b.y - y;
  const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  let tMaxX = ax > 0 ? ((stepX > 0 ? (x + 1 - x0) : (x0 - x)) / ax) : Infinity;
  let tMaxY = ay > 0 ? ((stepY > 0 ? (y + 1 - y0) : (y0 - y)) / ay) : Infinity;
  const tDX = ax > 0 ? 1/ax : Infinity, tDY = ay > 0 ? 1/ay : Infinity;
  const guard = ax + ay + 8;
  for (let i=0;i<guard;i++){
    if (tMaxX < tMaxY - 1e-12){ x += stepX; tMaxX += tDX; }
    else if (tMaxY < tMaxX - 1e-12){ y += stepY; tMaxY += tDY; }
    else {
      if (!grid.isFree({ x:x+stepX, y }) || !grid.isFree({ x, y:y+stepY })) return false;
      x += stepX; y += stepY; tMaxX += tDX; tMaxY += tDY;
    }
    if (!grid.isFree({ x, y })) return false;
    if (x === b.x && y === b.y) return true;
  }
  return false;
}
/* 采样类算法的连接半径 r(n) ∝ sqrt(log n / n)(PRM-star/FMT-star 渐进最优理论) */
function sampleRadius(n){
  const gamma = 3.0*Math.sqrt(W*H*0.8/Math.PI);
  return clamp(gamma*Math.sqrt(Math.log(n+1)/(n+1)), 150, 700);
}
/* 格点抖动采样:比纯随机更均匀,消除局部空洞(纯随机采样会让路图在角落断开) */
function jitteredSampleCells(n){
  const cols = Math.max(1, Math.ceil(Math.sqrt(n*W/H)));
  const rows = Math.max(1, Math.ceil(n/cols));
  const cw = W/cols, ch = H/rows;
  const pts = [];
  outer:
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    if (pts.length >= n) break outer;
    pts.push({ x:clamp((c+0.05+Math.random()*0.9)*cw, 1, W-1),
               y:clamp((r+0.05+Math.random()*0.9)*ch, 1, H-1) });
  }
  pts.cell = Math.max(cw, ch);
  return pts;
}
/* 点集空间桶:邻近查询免全对距离扫描 */
function buildPointBuckets(pts, cell){
  const b = new Map();
  for (let i=0;i<pts.length;i++){
    const k = Math.floor(pts[i].x/cell) + ',' + Math.floor(pts[i].y/cell);
    let arr = b.get(k);
    if (!arr){ arr = []; b.set(k, arr); }
    arr.push(i);
  }
  return { b, cell };
}
function pointBucketNear(pb, p, rings, out, skipFn){
  const seen = new Set();
  for (let rad=0; rad<=rings; rad++){
    const x0 = Math.floor((p.x-rad*pb.cell)/pb.cell), x1 = Math.floor((p.x+rad*pb.cell)/pb.cell);
    const y0 = Math.floor((p.y-rad*pb.cell)/pb.cell), y1 = Math.floor((p.y+rad*pb.cell)/pb.cell);
    for (let by=y0;by<=y1;by++) for (let bx=x0;bx<=x1;bx++){
      const key = bx + ',' + by;
      if (seen.has(key)) continue;
      seen.add(key);
      const arr = pb.b.get(key);
      if (!arr) continue;
      for (let t=0;t<arr.length;t++){ const i = arr[t]; if (skipFn && skipFn(i)) continue; out.push(i); }
    }
  }
  return out;
}
/* 路径视线剪枝:贪心拉直(去掉多余折点) */
function prunePath(pts){
  if (!pts || pts.length < 3) return pts ? pts.slice() : [];
  const out = [ pts[0] ];
  let i = 0, guard = 0;
  while (i < pts.length-1 && guard++ < 20000){
    let j = pts.length-1;
    while (j > i+1 && !segmentFree(pts[i], pts[j])) j--;
    out.push(pts[j]); i = j;
  }
  return out;
}

/* ============ Theta*(任意角 A*:父节点即视线可达的祖先) ============ */
function createThetaStar(){
  const a = {
    id:'theta', name:'Theta* 任意角', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    h(c){ return Math.hypot(c.x-this.goalC.x, c.y-this.goalC.y)*GRID; },
    d(u,v){ return Math.hypot(u.x-v.x, u.y-v.y)*GRID * grid.penalty(v); },
    init(){
      grid.buildFromWorld();
      this.startC = grid.cellAt(algoStart().x, algoStart().y);
      this.goalC = grid.cellAt(goal.x, goal.y);
      if (!grid.isFree(this.startC) || !grid.isFree(this.goalC)){ this.failReason='起点或终点被障碍物占据'; return false; }
      this.open = new MinHeap((x,y)=>x.f-y.f);
      this.g = new Map(); this.parent = new Map(); this.closed = new Set();
      this.pops = 0; this.t0 = performance.now();
      const s = this.startC, k = ck(s);
      this.g.set(k, 0); this.parent.set(k, null);
      this.open.push({ c:s, f:this.h(s) });
      visReset();
      vis.openCells.set(k, s);
      return true;
    },
    step(){
      const events = [];
      if (this.open.size === 0){
        this.done = true; this.failReason = '无可行路径(open 已空)';
        this.metrics.timeMs = performance.now()-this.t0;
        events.push({ type:'info', text:'Theta*:未找到路径' });
        return events;
      }
      const node = this.open.pop();
      const c = node.c, k = ck(c);
      if (this.closed.has(k)) return events;
      this.closed.add(k);
      this.pops++;
      vis.closedCells.set(k, c); vis.openCells.delete(k);
      vis.current = grid.cellCenter(c);
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
      if (k === ck(this.goalC)){
        this.done = true;
        this.path = this.buildPath();
        this.metrics.pathLen = pathLen(this.path);
        this.metrics.timeMs = performance.now()-this.t0;
        events.push({ type:'info', text:'Theta*:到达终点,扩展 '+this.pops+' 格,路径 '+this.metrics.pathLen.toFixed(0)+'px(任意角,无格对齐)' });
        return events;
      }
      const gk = this.g.get(k), pk = this.parent.get(k);
      for (const nb of grid.neighbors8(c)){
        const nk = ck(nb.c);
        if (this.closed.has(nk)) continue;
        let ng, np;
        if (pk && gridLineFree(pk, nb.c)){ ng = this.g.get(ck(pk)) + this.d(pk, nb.c); np = pk; }
        else { ng = gk + this.d(c, nb.c); np = c; }
        const old = this.g.get(nk);
        if (old === undefined || ng < old - 1e-6){
          this.g.set(nk, ng); this.parent.set(nk, np);
          this.open.push({ c:nb.c, f:ng + this.h(nb.c) });
          if (old === undefined){
            vis.openCells.set(nk, nb.c);
            const pc = grid.cellCenter(np), cc = grid.cellCenter(c);
            vis.edges.push({ x1:pc.x, y1:pc.y, x2:cc.x, y2:cc.y });
          }
        }
      }
      return events;
    },
    buildPath(){
      const cells = [];
      let cur = this.goalC, guard = 0;
      while (cur && guard++ < 50000){
        cells.unshift(cur);
        if (ck(cur) === ck(this.startC)) break;
        cur = this.parent.get(ck(cur));
      }
      const pts = cells.map(grid.cellCenter);
      if (pts.length < 3) return pts;
      const out = [ pts[0] ];
      let i = 0, g2 = 0;
      while (i < pts.length-1 && g2++ < 20000){
        let j = pts.length-1;
        while (j > i+1 && !gridLineFree(grid.cellAt(pts[i].x,pts[i].y), grid.cellAt(pts[j].x,pts[j].y))) j--;
        out.push(pts[j]); i = j;
      }
      return out;
    }
  };
  return a;
}

/* ============ 双向 A*(起点/终点两侧交替扩展,相遇拼接) ============ */
function createBidirectionalAstar(){
  const a = {
    id:'bidir', name:'双向 A*', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    h(c, t){ return Math.hypot(c.x-t.x, c.y-t.y)*GRID; },
    d(u,v){ return Math.hypot(u.x-v.x, u.y-v.y)*GRID * grid.penalty(v); },
    init(){
      grid.buildFromWorld();
      this.startC = grid.cellAt(algoStart().x, algoStart().y);
      this.goalC = grid.cellAt(goal.x, goal.y);
      if (!grid.isFree(this.startC) || !grid.isFree(this.goalC)){ this.failReason='起点或终点被障碍物占据'; return false; }
      this.openF = new MinHeap((x,y)=>x.f-y.f);
      this.openB = new MinHeap((x,y)=>x.f-y.f);
      this.gF = new Map(); this.gB = new Map();
      this.parentF = new Map(); this.parentB = new Map();
      this.closedF = new Set(); this.closedB = new Set();
      this.best = Infinity; this.meetC = null;
      this.pops = 0; this.turn = 0; this.t0 = performance.now();
      const ks = ck(this.startC), kg = ck(this.goalC);
      this.gF.set(ks, 0); this.parentF.set(ks, null);
      this.gB.set(kg, 0); this.parentB.set(kg, null);
      this.openF.push({ c:this.startC, f:this.h(this.startC, this.goalC) });
      this.openB.push({ c:this.goalC, f:this.h(this.goalC, this.startC) });
      visReset();
      vis.openCells.set(ks, this.startC);
      vis.backOpen.set(kg, this.goalC);
      if (ks === kg){ this.best = 0; this.meetC = this.startC; }
      return true;
    },
    expand(side){
      const fwd = side === 0;
      const open = fwd ? this.openF : this.openB;
      const closed = fwd ? this.closedF : this.closedB;
      const g = fwd ? this.gF : this.gB;
      const otherG = fwd ? this.gB : this.gF;
      const parent = fwd ? this.parentF : this.parentB;
      if (open.size === 0) return;
      const c = open.pop().c, k = ck(c);
      if (closed.has(k)) return; /* 过期堆项:节点已闭合 */
      closed.add(k);
      this.pops++;
      if (fwd){ vis.closedCells.set(k, c); vis.openCells.delete(k); }
      else { vis.backClosed.set(k, c); vis.backOpen.delete(k); }
      vis.current = grid.cellCenter(c);
      const gk = g.get(k);
      const oc = otherG.get(k);
      if (oc !== undefined && gk + oc < this.best){ this.best = gk + oc; this.meetC = c; }
      const tgt = fwd ? this.goalC : this.startC;
      for (const nb of grid.neighbors8(c)){
        const nk = ck(nb.c);
        const ng = gk + this.d(c, nb.c);
        const old = g.get(nk);
        if (old === undefined || ng < old - 1e-6){
          g.set(nk, ng); parent.set(nk, c);
          open.push({ c:nb.c, f:ng + this.h(nb.c, tgt) });
          if (fwd) vis.openCells.set(nk, nb.c); else vis.backOpen.set(nk, nb.c);
          const onb = otherG.get(nk);
          if (onb !== undefined && ng + onb < this.best){ this.best = ng + onb; this.meetC = nb.c; }
        }
      }
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
    },
    step(){
      const events = [];
      const pf = this.openF.size ? this.openF.peek().f : Infinity;
      const pb = this.openB.size ? this.openB.peek().f : Infinity;
      if (this.best < Infinity && (pf + pb >= this.best || !this.openF.size || !this.openB.size)){
        this.done = true;
        this.path = this.buildPath();
        this.metrics.pathLen = pathLen(this.path);
        this.metrics.timeMs = performance.now()-this.t0;
        events.push({ type:'info', text:'双向 A*:两侧相遇,扩展 '+this.pops+' 格,路径 '+this.metrics.pathLen.toFixed(0)+'px' });
        return events;
      }
      if (!this.openF.size && !this.openB.size){
        this.done = true; this.failReason = '无可行路径(双向 open 已空)';
        this.metrics.timeMs = performance.now()-this.t0;
        events.push({ type:'info', text:'双向 A*:未找到路径' });
        return events;
      }
      this.expand(this.turn);
      this.turn ^= 1;
      return events;
    },
    buildPath(){
      if (!this.meetC) return [];
      const fwd = [];
      let cur = this.meetC, guard = 0;
      while (cur && guard++ < 50000){
        fwd.unshift(grid.cellCenter(cur));
        if (ck(cur) === ck(this.startC)) break;
        cur = this.parentF.get(ck(cur));
      }
      const bwd = [];
      cur = this.meetC; guard = 0;
      while (cur && guard++ < 50000){
        bwd.push(grid.cellCenter(cur));
        if (ck(cur) === ck(this.goalC)) break;
        cur = this.parentB.get(ck(cur));
      }
      return fwd.concat(bwd.slice(1));
    }
  };
  return a;
}

/* ============ ARA*(Anytime Repairing A*:ε 逐轮收紧,先快后精) ============ */
function createARA(){
  const a = {
    id:'ara', name:'ARA* 随时修复', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    h(c){ return Math.hypot(c.x-this.goalC.x, c.y-this.goalC.y)*GRID; },
    d(u,v){ return Math.hypot(u.x-v.x, u.y-v.y)*GRID * grid.penalty(v); },
    init(){
      grid.buildFromWorld();
      this.startC = grid.cellAt(algoStart().x, algoStart().y);
      this.goalC = grid.cellAt(goal.x, goal.y);
      if (!grid.isFree(this.startC) || !grid.isFree(this.goalC)){ this.failReason='起点或终点被障碍物占据'; return false; }
      this.g = new Map(); this.parent = new Map();
      this.closed = new Set(); this.incons = new Set(); this.inOpen = new Set();
      this.eps = 3; this.MIN_EPS = 1;
      this.t0 = performance.now(); this.pops = 0;
      this.open = new MinHeap((x,y)=>x.f-y.f);
      const k = ck(this.startC);
      this.g.set(k, 0); this.parent.set(k, null);
      this.open.push({ c:this.startC, f:this.eps*this.h(this.startC), g:0 });
      this.inOpen.add(k);
      visReset();
      vis.openCells.set(k, this.startC);
      return true;
    },
    cellOfKey(k){ const p = k.split(','); return { x:+p[0], y:+p[1] }; },
    goalG(){ const v = this.g.get(ck(this.goalC)); return v === undefined ? Infinity : v; },
    popValid(){
      while (this.open.size){
        const node = this.open.pop();
        const k = ck(node.c);
        this.inOpen.delete(k);
        const gv = this.g.get(k);
        if (gv !== undefined && Math.abs(node.g - gv) < 1e-6) return node;
      }
      return null;
    },
    step(){
      const events = [];
      const gg = this.goalG();
      const top = this.open.size ? this.open.peek() : null;
      /* 本轮结束:open 空 或 最小 key 已不小于终点代价(标准 ARA* 终止条件) */
      if (!top || (gg < Infinity && top.f >= gg - 1e-9)){
        if (gg < Infinity){
          this.path = this.buildPath();
          this.metrics.pathLen = pathLen(this.path);
          events.push({ type:'info', text:'ARA*: ε='+this.eps.toFixed(2)+' 可用路径 '+this.metrics.pathLen.toFixed(0)+'px' });
        }
        if (this.eps <= this.MIN_EPS + 1e-9){
          this.done = true;
          this.metrics.timeMs = performance.now()-this.t0;
          if (!this.path.length){
            this.failReason = '无可行路径';
            events.push({ type:'info', text:'ARA*:未找到路径' });
          } else {
            events.push({ type:'info', text:'ARA*:收敛于 ε=1(最优),路径 '+this.metrics.pathLen.toFixed(0)+'px,扩展 '+this.pops+' 格' });
          }
          return events;
        }
        this.eps = Math.max(this.MIN_EPS, this.eps*0.6);
        for (const k of this.incons){
          const c = this.cellOfKey(k);
          this.open.push({ c, f:this.g.get(k)+this.eps*this.h(c), g:this.g.get(k) });
          this.inOpen.add(k);
          vis.openCells.set(k, c);
        }
        this.incons.clear();
        events.push({ type:'info', text:'ARA*:收紧 ε → '+this.eps.toFixed(2)+',继续改进…' });
        return events;
      }
      const node = this.popValid();
      if (!node) return events;
      const c = node.c, k = ck(c);
      this.pops++;
      this.closed.add(k);
      vis.closedCells.set(k, c); vis.openCells.delete(k);
      vis.current = grid.cellCenter(c);
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
      const gk = this.g.get(k);
      for (const nb of grid.neighbors8(c)){
        const nk = ck(nb.c);
        const ng = gk + this.d(c, nb.c);
        const old = this.g.get(nk);
        if (old === undefined || ng < old - 1e-6){
          this.g.set(nk, ng); this.parent.set(nk, c);
          if (this.closed.has(nk)) this.incons.add(nk);
          else {
            /* g 改进即重新入堆(popValid 用 g 快照丢弃过期项);否则节点会以旧代价出堆 */
            this.open.push({ c:nb.c, f:ng + this.eps*this.h(nb.c), g:ng });
            if (!this.inOpen.has(nk)){ this.inOpen.add(nk); vis.openCells.set(nk, nb.c); }
          }
        }
      }
      return events;
    },
    buildPath(){
      const pts = [];
      let cur = this.goalC, guard = 0;
      while (cur && guard++ < 50000){
        pts.unshift(grid.cellCenter(cur));
        if (ck(cur) === ck(this.startC)) break;
        cur = this.parent.get(ck(cur));
      }
      return pts;
    }
  };
  return a;
}

/* ============ 束搜索(每层只保留 h 最小的 BEAM 个节点) ============ */
function createBeamSearch(){
  const a = {
    id:'beam', name:'束搜索 Beam', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    h(c){ return Math.hypot(c.x-this.goalC.x, c.y-this.goalC.y); },
    init(){
      grid.buildFromWorld();
      this.startC = grid.cellAt(algoStart().x, algoStart().y);
      this.goalC = grid.cellAt(goal.x, goal.y);
      if (!grid.isFree(this.startC) || !grid.isFree(this.goalC)){ this.failReason='起点或终点被障碍物占据'; return false; }
      this.BEAM = 32; this.attempt = 0;
      this.t0 = performance.now();
      this.reset();
      return true;
    },
    reset(){
      this.frontier = [ this.startC ];
      this.visited = new Set([ ck(this.startC) ]);
      this.parent = new Map(); this.parent.set(ck(this.startC), null);
      this.depth = 0; this.pops = 0;
      visReset();
      vis.openCells.set(ck(this.startC), this.startC);
    },
    step(){
      const events = [];
      if (this.frontier.length === 0){
        if (this.attempt < 1){
          this.attempt++;
          this.BEAM *= 8;
          this.reset();
          events.push({ type:'info', text:'束搜索:前沿枯竭,束宽放宽至 '+this.BEAM+' 重试…' });
          return events;
        }
        this.done = true; this.failReason = '无可行路径(束宽不足)';
        this.metrics.timeMs = performance.now()-this.t0;
        events.push({ type:'info', text:'束搜索:未找到路径(束宽 '+this.BEAM+')' });
        return events;
      }
      const next = [];
      let found = null;
      for (const c of this.frontier){
        const k = ck(c);
        vis.closedCells.set(k, c); vis.openCells.delete(k);
        vis.current = grid.cellCenter(c);
        this.pops++;
        for (const nb of grid.neighbors8(c)){
          const nk = ck(nb.c);
          if (this.visited.has(nk)) continue;
          this.visited.add(nk);
          this.parent.set(nk, c);
          if (nk === ck(this.goalC)){ found = nb.c; break; }
          next.push({ c:nb.c, h:this.h(nb.c) });
        }
        if (found) break;
      }
      this.depth++;
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
      if (found){
        this.done = true;
        this.path = this.buildPath(found);
        this.metrics.pathLen = pathLen(this.path);
        events.push({ type:'info', text:'束搜索:到达终点,深度 '+this.depth+',扩展 '+this.pops+' 格,路径 '+this.metrics.pathLen.toFixed(0)+'px' });
        return events;
      }
      /* 关键剪枝:非最优的 (next.length-BEAM) 个节点永久丢弃 → 内存恒定 O(BEAM·深度) */
      next.sort((p,q)=>p.h-q.h);
      this.frontier = next.slice(0, this.BEAM).map(o=>o.c);
      for (const c of this.frontier) vis.openCells.set(ck(c), c);
      events.push({ type:'info', text:'束搜索:深度 '+this.depth+',保留前沿 '+this.frontier.length+'/'+next.length });
      return events;
    },
    buildPath(c){
      const pts = [];
      let cur = c, guard = 0;
      while (cur && guard++ < 50000){
        pts.unshift(grid.cellCenter(cur));
        if (ck(cur) === ck(this.startC)) break;
        cur = this.parent.get(ck(cur));
      }
      return pts;
    }
  };
  return a;
}

/* ============ PRM*(渐进最优概率路图:r(n) 半径全连接) ============ */
function createPRMStar(){
  const a = {
    id:'prmstar', name:'PRM*', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    init(){
      this.phase = 'sample';
      const s0 = algoStart();
      this.samples = [ {x:s0.x,y:s0.y}, {x:goal.x,y:goal.y} ];
      this.startIdx = 0; this.goalIdx = 1;
      this.edges = []; this.adj = [];
      this.N = 1200; this.MAXK = 24;
      this.cells = jitteredSampleCells(this.N);
      this.ci = 0; this.si = 0; this.pops = 0;
      this.t0 = performance.now();
      visReset();
      vis.samples = this.samples;
      return true;
    },
    step(){
      const events = [];
      if (this.phase === 'sample'){
        for (let k=0;k<24 && this.ci < this.cells.length && this.samples.length < this.N+2;k++){
          const p = this.cells[this.ci++];
          if (pointFree(p.x,p.y)) this.samples.push(p);
        }
        this.metrics.expanded = this.samples.length;
        this.metrics.timeMs = performance.now()-this.t0;
        if (this.samples.length >= this.N+2 || this.ci >= this.cells.length){
          this.adj = this.samples.map(() => new Set());
          /* 理论半径 r(n) ∝ sqrt(log n/n) 与采样格距取大者,保证路图连通 */
          this.r = Math.max(sampleRadius(this.samples.length), 1.4*this.cells.cell);
          buildObstacleBuckets();
          this.pb = buildPointBuckets(this.samples, 300);
          this.phase = 'graph';
          vis.samples = this.samples;
          events.push({ type:'info', text:'PRM*:采样 '+this.samples.length+' 点,r(n)='+this.r.toFixed(0)+'px,半径全连接…' });
        } else {
          events.push({ type:'info', text:'PRM*:采样 '+this.samples.length+'/'+this.N });
        }
        return events;
      }
      if (this.phase === 'graph'){
        if (this.si >= this.samples.length){
          this.phase = 'search';
          this.open = new MinHeap((x,y)=>x.f-y.f);
          this.g = new Map(); this.parent = new Map(); this.closed = new Set();
          this.g.set(this.startIdx, 0);
          this.open.push({ i:this.startIdx, g:0, f:Math.hypot(this.samples[0].x-this.samples[1].x, this.samples[0].y-this.samples[1].y) });
          events.push({ type:'info', text:'PRM*:路图完成('+this.edges.length+' 边),图上 A* 搜索…' });
          return events;
        }
        const i = this.si, p = this.samples[i];
        const r2 = this.r*this.r;
        const raw = [];
        pointBucketNear(this.pb, p, Math.ceil(this.r/300)+1, raw, xx => xx === i);
        const cand = [];
        const seen = new Set();
        for (const j of raw){
          if (seen.has(j)) continue;
          seen.add(j);
          const q = this.samples[j];
          const dx = p.x-q.x, dy = p.y-q.y;
          const dd = dx*dx+dy*dy;
          if (dd > r2) continue;
          cand.push([j, dd]);
        }
        cand.sort((x,y)=>x[1]-y[1]);
        let added = 0;
        for (let t=0;t<cand.length && added<this.MAXK;t++){
          const j = cand[t][0];
          if (this.adj[i].has(j)) continue;
          if (!segmentFreeInfl(p, this.samples[j], obsBuckets)) continue;
          this.adj[i].add(j); this.adj[j].add(i);
          this.edges.push([i,j]);
          added++;
        }
        this.si++;
        this.metrics.expanded = this.samples.length;
        this.metrics.timeMs = performance.now()-this.t0;
        if (this.si % 50 === 0) events.push({ type:'info', text:'PRM*:连接 '+this.si+'/'+this.samples.length+' 点,'+this.edges.length+' 边' });
        return events;
      }
      if (this.open.size === 0){
        this.done = true; this.failReason = '图上无可行路径';
        this.metrics.timeMs = performance.now()-this.t0;
        events.push({ type:'info', text:'PRM*:图上无路径' });
        return events;
      }
      const node = this.open.pop();
      const i = node.i;
      if (this.closed.has(i)) return events;
      this.closed.add(i); this.pops++;
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
      vis.prmClosed.set(i, this.samples[i]);
      vis.prmOpen.delete(i);
      vis.current = this.samples[i];
      if (i === this.goalIdx){
        this.done = true;
        this.path = this.backtrace(i);
        this.metrics.pathLen = pathLen(this.path);
        events.push({ type:'info', text:'PRM*:找到路径,扩展 '+this.pops+' 节点,路径 '+this.metrics.pathLen.toFixed(0)+'px' });
        return events;
      }
      for (const j of this.adj[i]){
        if (this.closed.has(j)) continue;
        const ng = node.g + Math.hypot(this.samples[i].x-this.samples[j].x, this.samples[i].y-this.samples[j].y);
        const old = this.g.get(j);
        if (old === undefined || ng < old - 1e-6){
          this.g.set(j, ng); this.parent.set(j, i);
          this.open.push({ i:j, g:ng, f:ng+Math.hypot(this.samples[j].x-this.samples[this.goalIdx].x, this.samples[j].y-this.samples[this.goalIdx].y) });
          vis.prmOpen.set(j, this.samples[j]);
        }
      }
      return events;
    },
    backtrace(i){
      const pts = [];
      let cur = i, guard = 0;
      while (cur !== undefined && guard++ < 50000){
        pts.unshift(this.samples[cur]);
        if (cur === this.startIdx) break;
        cur = this.parent.get(cur);
      }
      return pts;
    }
  };
  return a;
}

/* ============ FMT*(快速行进树:采样 + 惰性动态规划波前) ============ */
function createFMT(){
  const a = {
    id:'fmt', name:'FMT* 快速行进树', done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    init(){
      this.phase = 'sample';
      const s0 = algoStart();
      this.samples = [ {x:s0.x,y:s0.y}, {x:goal.x,y:goal.y} ];
      this.startIdx = 0; this.goalIdx = 1;
      this.edges = [];
      this.N = 1500; this.K = 16; this.TB = 300;
      this.cells = jitteredSampleCells(this.N);
      this.ci = 0; this.pops = 0; this.jumps = 0;
      this.t0 = performance.now();
      visReset();
      vis.samples = this.samples;
      return true;
    },
    treeBucketAdd(i){
      const p = this.samples[i];
      const k = Math.floor(p.x/this.TB) + ',' + Math.floor(p.y/this.TB);
      let arr = this.tb.get(k);
      if (!arr){ arr = []; this.tb.set(k, arr); }
      arr.push(i);
    },
    nearTree(p, K){
      /* 树节点空间桶逐圈扩展取最近邻(免全树扫描) */
      const out = [];
      const seen = this.seenB;
      seen.clear();
      const TB = this.TB;
      for (let rad=0; rad<9 && out.length < K; rad++){
        const x0 = Math.floor((p.x-rad*TB)/TB), x1 = Math.floor((p.x+rad*TB)/TB);
        const y0 = Math.floor((p.y-rad*TB)/TB), y1 = Math.floor((p.y+rad*TB)/TB);
        for (let by=y0;by<=y1;by++) for (let bx=x0;bx<=x1;bx++){
          const key = bx + ',' + by;
          if (seen.has(key)) continue;
          seen.add(key);
          const arr = this.tb.get(key);
          if (!arr) continue;
          for (let t=0;t<arr.length;t++){ out.push(arr[t]); if (out.length >= K) return out; }
        }
      }
      return out;
    },
    step(){
      const events = [];
      if (this.phase === 'sample'){
        for (let k=0;k<24 && this.ci < this.cells.length && this.samples.length < this.N+2;k++){
          const p = this.cells[this.ci++];
          if (pointFree(p.x,p.y)) this.samples.push(p);
        }
        this.metrics.expanded = this.samples.length;
        this.metrics.timeMs = performance.now()-this.t0;
        if (this.samples.length >= this.N+2 || this.ci >= this.cells.length){
          this.r = Math.max(sampleRadius(this.samples.length), 1.4*this.cells.cell);
          buildObstacleBuckets();
          this.pb = buildPointBuckets(this.samples, 300);
          this.tb = new Map(); this.seenB = new Set();
          this.tree = [ this.startIdx ];
          this.parent = new Map();
          this.cost = new Map([[this.startIdx, 0]]);
          this.unvisited = new Set();
          for (let i=0;i<this.samples.length;i++) if (i !== this.startIdx) this.unvisited.add(i);
          this.z = this.startIdx;
          this.treeBucketAdd(this.startIdx);
          this.phase = 'wave';
          vis.samples = this.samples;
          vis.prmClosed.set(this.startIdx, this.samples[this.startIdx]);
          events.push({ type:'info', text:'FMT*:采样 '+this.samples.length+' 点,r='+this.r.toFixed(0)+'px,惰性动态规划波前…' });
        } else {
          events.push({ type:'info', text:'FMT*:采样 '+this.samples.length+'/'+this.N });
        }
        return events;
      }
      const z = this.z, p = this.samples[z];
      const r2 = this.r*this.r;
      const raw = [];
      pointBucketNear(this.pb, p, Math.ceil(this.r/300)+1, raw, xx => !this.unvisited.has(xx));
      const cand = [];
      const seen = new Set();
      for (const j of raw){
        if (seen.has(j)) continue;
        seen.add(j);
        const q = this.samples[j];
        const dx = p.x-q.x, dy = p.y-q.y;
        const dd = dx*dx+dy*dy;
        if (dd > r2) continue;
        cand.push([j, dd]);
      }
      cand.sort((x,y)=>x[1]-y[1]);
      const limit = Math.min(cand.length, 30);
      let bestX = -1, bestC = Infinity, bestY = -1;
      for (let t=0;t<limit;t++){
        const x = cand[t][0], q = this.samples[x];
        let bc = Infinity, by = -1;
        const tn = this.nearTree(q, this.K);
        for (let ti=0;ti<tn.length;ti++){
          const y = tn[ti];
          const cy = this.cost.get(y);
          if (cy === undefined || cy >= bc) continue;
          const d = Math.hypot(this.samples[y].x-q.x, this.samples[y].y-q.y);
          if (cy + d >= bc) continue;
          if (!segmentFreeInfl(this.samples[y], q, obsBuckets)) continue;
          bc = cy + d; by = y;
        }
        if (by >= 0 && bc < bestC){ bestC = bc; bestX = x; bestY = by; }
      }
      if (bestX < 0){
        /* 波前局部枯竭:跳到最近的未访问点,保证搜索继续前进 */
        let nx = -1, nd = Infinity;
        for (const x of this.unvisited){
          const q = this.samples[x];
          const d = (q.x-p.x)*(q.x-p.x) + (q.y-p.y)*(q.y-p.y);
          if (d < nd){ nd = d; nx = x; }
        }
        if (nx < 0){
          this.done = true; this.failReason = '无可行路径(未访问集已空)';
          this.metrics.timeMs = performance.now()-this.t0;
          events.push({ type:'info', text:'FMT*:未找到路径' });
          return events;
        }
        this.z = nx; this.jumps++;
        return events;
      }
      this.parent.set(bestX, bestY);
      this.cost.set(bestX, bestC);
      this.tree.push(bestX);
      this.unvisited.delete(bestX);
      this.edges.push([bestY, bestX]);
      this.treeBucketAdd(bestX);
      vis.prmClosed.set(z, this.samples[z]);
      vis.prmOpen.set(bestX, this.samples[bestX]);
      this.z = bestX;
      this.pops++;
      this.metrics.expanded = this.pops;
      this.metrics.timeMs = performance.now()-this.t0;
      vis.current = this.samples[bestX];
      if (bestX === this.goalIdx){
        this.done = true;
        this.path = this.backtrace(this.goalIdx);
        this.metrics.pathLen = pathLen(this.path);
        events.push({ type:'info', text:'FMT*:到达终点,'+this.pops+' 次波前扩展,路径 '+this.metrics.pathLen.toFixed(0)+'px'+(this.jumps?',跳跃 '+this.jumps+' 次':'') });
        return events;
      }
      if (this.pops % 150 === 0) events.push({ type:'info', text:'FMT*:波前 '+this.pops+' 步,树 '+this.tree.length+' 点' });
      return events;
    },
    backtrace(i){
      const pts = [];
      let cur = i, guard = 0;
      while (cur !== undefined && guard++ < 50000){
        pts.unshift(this.samples[cur]);
        if (cur === this.startIdx) break;
        cur = this.parent.get(cur);
      }
      return pts;
    }
  };
  return a;
}

/* ============ Informed RRT* / RRT*-Smart(采样式渐进优化) ============ */
function createRRTStarVariant(kind){
  const informed = kind === 'informed';
  const name = informed ? 'Informed RRT*' : 'RRT*-Smart';
  const MAX_ITER = 20000;              /* 初始解阶段安全阀(寻解极慢时兜底) */
  const OPT_ITER = informed ? 3000 : 2200; /* 找到初始解后的优化迭代预算 */
  const a = {
    id: informed ? 'informedrrt' : 'rrtsmart', name, done:false, path:[], replanRun:false, failReason:'',
    metrics:{ pathLen:0, expanded:0, timeMs:0, collisions:0 },
    init(){
      const s0 = algoStart();
      this.s0 = s0;
      this.nodes = [ { x:s0.x, y:s0.y, parent:-1, cost:0 } ];
      this.edges = [];
      this.iter = 0; this.MAX_ITER = MAX_ITER; this.OPT_ITER = OPT_ITER; this.solvedIter = -1;
      this.cBest = Infinity;
      this.cMin = Math.hypot(goal.x-s0.x, goal.y-s0.y);
      this.bestIdx = -1;
      this.pathPts = null;
      this.t0 = performance.now();
      visReset();
      return true;
    },
    backtrace(idx){
      const pts = [];
      let i = idx, guard = 0;
      while (i >= 0 && guard++ < 50000){
        const n = this.nodes[i];
        pts.unshift({ x:n.x, y:n.y });
        if (i === 0) break;
        i = n.parent;
      }
      return pts;
    },
    refreshPath(){
      const pts = this.backtrace(this.bestIdx);
      pts.push({ x:goal.x, y:goal.y });
      this.pathPts = pts;
    },
    sampleUniform(){ return { x:Math.random()*W, y:Math.random()*H }; },
    sampleEllipse(){
      /* 以起点/终点为焦点的椭圆:长轴 = 当前最优代价(Informed RRT* 的核心) */
      const cB = this.cBest;
      const a1 = cB/2;
      const b1 = Math.sqrt(Math.max(0, cB*cB - this.cMin*this.cMin))/2;
      const cx = (this.s0.x+goal.x)/2, cy = (this.s0.y+goal.y)/2;
      const th = Math.atan2(goal.y-this.s0.y, goal.x-this.s0.x);
      let ux = 0, uy = 0, guard = 0;
      do { ux = Math.random()*2-1; uy = Math.random()*2-1; } while (ux*ux+uy*uy > 1 && guard++ < 50);
      const co = Math.cos(th), si = Math.sin(th);
      return { x:cx + co*ux*a1 - si*uy*b1, y:cy + si*ux*a1 + co*uy*b1 };
    },
    sample(){
      /* 25% 目标偏置:大地图上纯随机采样几乎无法碰到终点 */
      if (Math.random() < 0.25) return { x:goal.x, y:goal.y };
      if (informed){
        return (isFinite(this.cBest) && this.cBest > this.cMin + 1) ? this.sampleEllipse() : this.sampleUniform();
      }
      /* RRT*-Smart:有解后 60% 概率沿当前最优路径扰动采样(视觉节点) */
      if (this.pathPts && Math.random() < 0.6){
        const p = this.pathPts[Math.floor(Math.random()*this.pathPts.length)];
        const ang = Math.random()*Math.PI*2, rr = Math.random()*RRT_STEP*3;
        return { x: clamp(p.x + Math.cos(ang)*rr, 0, W), y: clamp(p.y + Math.sin(ang)*rr, 0, H) };
      }
      return this.sampleUniform();
    },
    step(){
      const events = [];
      /* 收敛:安全阀耗尽 / 找到解后已用满优化预算 / 已逼近直线下界 */
      if (this.iter >= this.MAX_ITER ||
          (this.bestIdx >= 0 && (this.iter >= this.solvedIter + this.OPT_ITER || this.cBest <= this.cMin*1.005 + 2))){
        this.finish(events); return events;
      }
      for (let k=0;k<4 && this.iter < this.MAX_ITER;k++){
        this.iter++;
        const s = this.sample();
        if (s.x < 0 || s.x > W || s.y < 0 || s.y > H) continue;
        let ni = 0, bd = Infinity;
        for (let i=0;i<this.nodes.length;i++){
          const dx = this.nodes[i].x-s.x, dy = this.nodes[i].y-s.y, dd = dx*dx+dy*dy;
          if (dd < bd){ bd = dd; ni = i; }
        }
        const near = this.nodes[ni], dn = Math.sqrt(bd);
        let px, py;
        if (dn <= RRT_STEP){ px = s.x; py = s.y; }
        else { px = near.x + (s.x-near.x)/dn*RRT_STEP; py = near.y + (s.y-near.y)/dn*RRT_STEP; }
        if (!pointFree(px, py)) continue;
        const nn = { x:px, y:py, parent:-1, cost:0 };
        /* 标准 RRT* choose-parent:在 REWIRE_R 邻域内选"可无碰撞连接且代价最小"的近邻,
           最近邻连线被障碍挡住时改用其他近邻(否则该次迭代直接作废,树几乎不长) */
        const cand = [];
        for (let i=0;i<this.nodes.length;i++){
          const dd = Math.hypot(px-this.nodes[i].x, py-this.nodes[i].y);
          if (dd <= REWIRE_R) cand.push([i, dd]);
        }
        cand.sort((a,b)=>a[1]-b[1]);
        let best = -1, bestCost = Infinity;
        for (let t=0;t<cand.length;t++){
          const i = cand[t][0], dd = cand[t][1];
          const cc = this.nodes[i].cost + dd;
          if (cc >= bestCost) continue;
          if (!segmentFree(this.nodes[i], nn)) continue;
          bestCost = cc; best = i;
        }
        if (best < 0) continue;
        nn.parent = best; nn.cost = bestCost;
        this.nodes.push(nn);
        const idx = this.nodes.length-1;
        this.edges.push({ a:nn.parent, b:idx, kind:'new' });
        let rewired = 0;
        for (let i=0;i<idx;i++){
          if (i === nn.parent) continue;
          const dd = Math.hypot(px-this.nodes[i].x, py-this.nodes[i].y);
          if (dd > REWIRE_R || nn.cost + dd >= this.nodes[i].cost - 1e-9) continue;
          if (!segmentFree(nn, this.nodes[i])) continue;
          this.nodes[i].parent = idx; this.nodes[i].cost = nn.cost + dd;
          this.edges.push({ a:idx, b:i, kind:'rewire' });
          rewired++;
        }
        const dg = Math.hypot(goal.x-px, goal.y-py);
        if (nn.cost + dg < this.cBest && segmentFree(nn, { x:goal.x, y:goal.y })){
          this.cBest = nn.cost + dg;
          this.bestIdx = idx;
          if (this.solvedIter < 0) this.solvedIter = this.iter;
          this.refreshPath();
          events.push({ type:'info', text:name+':第 '+this.iter+' 次迭代找到更优路径 '+this.cBest.toFixed(0)+'px' });
        } else if (rewired && this.iter % 60 === 0){
          events.push({ type:'info', text:name+':迭代 '+this.iter+'/'+this.MAX_ITER+',节点 '+this.nodes.length+',重连 '+rewired });
        }
      }
      this.metrics.expanded = this.nodes.length;
      this.metrics.timeMs = performance.now()-this.t0;
      return events;
    },
    finish(events){
      this.done = true;
      this.metrics.expanded = this.nodes.length;
      this.metrics.timeMs = performance.now()-this.t0;
      if (this.bestIdx < 0){
        this.failReason = '未找到可行路径';
        events.push({ type:'info', text:name+':'+this.failReason });
        return;
      }
      const pts = this.backtrace(this.bestIdx);
      pts.push({ x:goal.x, y:goal.y });
      this.path = prunePath(pts);
      this.metrics.pathLen = pathLen(this.path);
      events.push({ type:'info', text:name+':收敛,'+this.iter+' 次迭代,'+this.nodes.length+' 节点,路径 '+this.metrics.pathLen.toFixed(0)+'px' });
    }
  };
  return a;
}
function createInformedRRT(){ return createRRTStarVariant('informed'); }
function createRRTSmart(){ return createRRTStarVariant('smart'); }

/* ============ Worker 并行搜索(主线程侧) ============ */
const COMPETE_IDS = new Set(['rrt','rrtstar','rrtconnect','prm','aco','apf','prmstar','fmt','informedrrt','rrtsmart']);
let workerOk = false, worker1 = null, competeWorkers = [], pendingBatches = [];
let workerSrcCache = null;
function mkSearchWorker(){
  try{
    if (typeof Worker === 'undefined' || typeof URL === 'undefined' || typeof Blob === 'undefined') return null;
    if (!workerSrcCache){
      const cs = document.currentScript;
      workerSrcCache = cs ? cs.textContent : '';
      if (!workerSrcCache){
        // 事件回调里 currentScript 为 null:回退取最后一个内联 script
        const ss = document.querySelectorAll('script');
        workerSrcCache = ss.length ? ss[ss.length-1].textContent : '';
      }
    }
    if (!workerSrcCache) return null;
    return new Worker(URL.createObjectURL(new Blob([workerSrcCache], { type:'text/javascript' })));
  }catch(err){ return null; }
}
function setupWorkers(){
  worker1 = mkSearchWorker();
  if (!worker1) return;
  workerOk = true;
  worker1.onmessage = (e) => handleWorkerMsg(0, e.data);
}
function workerAlgoShadow(id){
  const def = ALGORITHMS.find(a=>a.id===id);
  return { id, name: def ? def.name : id, done:false, path:[], failReason:'', metrics:{ expanded:0, timeMs:0 },
    antsA:null, antsB:null, pheromone:null, replanRun:false, hasPlan:false };
}
function applyInc(inc){
  if (!inc) return;
  for (const it of inc){
    const t = it[0];
    if (t==='ms'){ const n=it[1],k=it[2],v=it[3]; if (vis[n] && vis[n].set) vis[n].set(k,v); }
    else if (t==='md'){ const n=it[1],k=it[2]; if (vis[n] && vis[n].delete) vis[n].delete(k); }
    else if (t==='mc'){ const n=it[1]; if (vis[n] && vis[n].clear) vis[n].clear(); }
    else if (t==='ap'){ const n=it[1],v=it[2]; if (n !== 'path' && vis[n] && vis[n].push) vis[n].push(v); }
    /* path 由主线程管理(重规划保留旧绿线、完成后替换),忽略 worker 的 path 增量防闪烁 */
    else if (t==='al'){ const n=it[1],len=it[2]; if (n !== 'path' && vis[n]) vis[n].length = len; }
    else if (t==='cur'){ vis.current = it[1]; }
    else if (t==='force'){ vis.force = it[1]; }
    else if (t==='samples'){ vis.samples = it[1]; }
  }
}
function handleWorkerMsg(src, m){
  if (src > 0){
    /* 竞争 worker:只取先完成的"成功"路径(失败结果不抢占,等主 worker 定论) */
    if (m.type === 'done' && (!m.path || !m.path.length)) return;
    if (m.type === 'done' && algo && !algo.done){
      algo.done = true; algo.path = m.path || []; algo.failReason = m.failReason || '';
      algo.metrics = m.metrics || algo.metrics; algo.replanRun = !!m.replanRun; algo.hasPlan = !!m.hasPlan;
      algo.antsA = m.antsA; algo.antsB = m.antsB; if (m.pheromone) algo.pheromone = m.pheromone;
      terminateWorkers();
      pendingBatches.length = 0;
    }
    return;
  }
  /* 主渲染 worker(src === 0) */
  if (m.type === 'init'){
    if (m.ok){
      workerReplanPending = false;
      if (algo && algo.id === 'dlite') algo.blockedBefore = blockedSet();
      if (workerInitPending){
        workerInitPending = false;
        afterAlgoInit(true, ''); /* 手动搜索:正式进入 searching 模式,驱动动画消费 */
      }
      /* 重规划:mode 已由 tryReplan 设置,无需重复 */
    } else {
      const fromReplan = workerReplanPending;
      workerInitPending = false; workerReplanPending = false;
      afterAlgoInit(false, m.failReason || '初始化失败', fromReplan);
    }
    return;
  }
  if (m.type === 'info'){ actionText(m.text); return; }
  if (m.type === 'big'){
    if (algo) algo[m.name] = m.data;
    if (m.name === 'samples') vis.samples = m.data;
    return;
  }
  if (m.type === 'batch'){
    /* 立即消费(消除 postMessage 背压,worker 可满载);渲染实时反映搜索进度 */
    applyInc(m.inc);
    if (algo){
      algo.metrics.expanded = m.expanded;
      algo.metrics.timeMs = m.timeMs;
      if (m.antsA || m.antsB){ algo.antsA = m.antsA; algo.antsB = m.antsB; }
    }
    return;
  }
  if (m.type === 'done'){
    algo.done = true; algo.path = m.path || []; algo.failReason = m.failReason || '';
    algo.metrics = m.metrics || algo.metrics; algo.replanRun = !!m.replanRun; algo.hasPlan = !!m.hasPlan;
    algo.antsA = m.antsA; algo.antsB = m.antsB; if (m.pheromone) algo.pheromone = m.pheromone;
    terminateWorkers();
    pendingBatches.length = 0;
  }
}
let workerInitPending = false, workerReplanPending = false;

  worker1.onmessage = (e) => handleWorkerMsg(0, e.data);

    for (const o of world.obstacles){

let lastPerceptionCar = { x:-1e9, y:-1e9 };

  lastPerceptionCar = { x:car.x, y:car.y };
  const cols = grid.cols, rows = grid.rows;
  if (!grid.visited || grid.visited.length !== cols*rows) grid.visited = new Uint8Array(cols*rows);
  if (!percBlocked || percBlocked.length !== cols*rows){

  if (!percVisNow || percVisNow.length !== cols*rows) percVisNow = new Uint8Array(cols*rows);

    const x0 = Math.max(0, Math.floor(o.x/GRID)), x1 = Math.min(cols-1, Math.floor((o.x+o.w)/GRID));
    const y0 = Math.max(0, Math.floor(o.y/GRID)), y1 = Math.min(rows-1, Math.floor((o.y+o.h)/GRID));
    for (let y=y0;y<=y1;y++){
