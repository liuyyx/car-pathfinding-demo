      }
    }
  }
  carStep(car, dt2);
  if (mode === 'following'){
    /* 前方路径被真实障碍挡住就重规划(与"启用移动"无关):
       感知模式下路径可能穿过尚未看到的区域,提前 600px 发现即绕开,车不硬闯。 */
    tryReplan(false);
    if (moveChk.checked){
      if (persistChk.checked){
        // 持续寻路:每 0.2s 强制重规划,车始终沿最新路径
        if (performance.now() - lastPersistT > 200){
          lastPersistT = performance.now();
          tryReplan(true);
        }
      } else if (gridChangedByMoving()) tryReplan(true);
    }
  }
  if (vehicleCollides(car, world.obstacles)){
    if (handleCarCollision()) tryReplan(true);
    return;
  }
  const dG = dist(car, goal);
  const pathDone = tracker && tracker.idx >= tracker.pts.length-1 && Math.hypot(car.x-tracker.pts[tracker.pts.length-1].x, car.y-tracker.pts[tracker.pts.length-1].y) < 25;
  if (dG < ARRIVE_DIST || pathDone){
    mode = 'arrived'; running = false;
    failMsg = '';
    pushMetrics();
    actionText('已到达终点');
    return;
  }
  /* 卡死检测:连续 5s 位移极小(前进/倒车都被堵) → 明确提示,避免"车不动也说不清"的哑状态 */
  if (!stallPos || Math.hypot(car.x-stallPos.x, car.y-stallPos.y) > 14){
    stallPos = { x:car.x, y:car.y }; stallT = performance.now(); stallWarned = false;
  } else if (!stallWarned && performance.now() - stallT > 5000){
    stallWarned = true;
    actionText('小车被困:前后都被堵住,可移动障碍物或点"重置"');
  }
}
function fail(msg, fromFollowing){
  mode = 'failed'; running = false; failMsg = msg; flashStart = performance.now();
  actionText(msg);
  if (fromFollowing) pushMetrics();
  else renderMetrics();
}
function pushMetrics(){
  if (!metricsLive.alg) return;
  metricsHistory.unshift(Object.assign({}, metricsLive));
  if (metricsHistory.length > 8) metricsHistory.pop();
  metricsLive = { alg:'', pathLen:0, expanded:0, timeMs:0, collisions:0 };
  renderMetrics();
}
function abortRun(msg){
  workerAbort();
  algo = null; mode = 'idle'; running = false;
  replanning = false; dynamicStart = null;
  pendingBatches.length = 0;
  visReset(); dliteDirty = false; btnReplan.disabled = true;
  resetPerception();
  resetCarToStart();
  grid.buildFromWorld();
  if (msg) actionText(msg); else actionText('就绪:点击空地设置终点,或选工具编辑障碍物');
  renderMetrics();
}
function handleEvents(ev){
  if (!ev) return;
  for (const e of ev) if (e.type === 'info') actionText(e.text);
}

/* ============ 世界编辑 ============ */
function afterWorldChange(){
  grid.buildFromWorld();
  updateCoverDisplay();
  resetPerception(); /* 地图变了:记忆作废(感知模式下会立刻按新地图重算) */
  if (algo && algo.id === 'dlite' && algo.hasPlan && (mode === 'idle' || mode === 'arrived' || mode === 'following')){
    dliteDirty = true; btnReplan.disabled = false;
    actionText('地图已变化,可点击"重规划"增量修复路径');
  } else if (mode === 'searching'){
    abortRun('地图已变化,已中断当前运行');
  } else if (mode === 'following'){
    actionText('地图已变化,小车继续行驶,请观察碰撞');
  }
}
function placeObstacle(r){
  if (!rectClear(r)) return false;
  world.obstacles.push(r);
  afterWorldChange();
  return true;
}
function deleteObstacleAt(wx,wy){
  for (let i=0;i<world.obstacles.length;i++){
    const o = world.obstacles[i];
    if (wx>=o.x && wx<=o.x+o.w && wy>=o.y && wy<=o.y+o.h){
      world.obstacles.splice(i,1);
      if (selectedObstacle === o) selectedObstacle = null;
      afterWorldChange();
      return true;
    }
  }
  return false;
}
function setGoal(wx,wy){
  if (pointInInflated(wx,wy,GOAL_CLEAR)){ actionText('终点不能设在障碍物内或过近'); return; }
  if (Math.hypot(wx-start.x, wy-start.y) < 200){ actionText('终点距起点至少 200px'); return; }
  if (wx < 10 || wy < 10 || wx > W-10 || wy > H-10){ actionText('终点超出世界边界'); return; }
  goal.x = wx; goal.y = wy;
  actionText('已设置终点');
}
function carClearRect(){
  const s = Math.max(CAR_L, CAR_W) + 16; /* 车任意朝向的包围盒 + 余量 */
  return { x: car.x - s/2, y: car.y - s/2, w: s, h: s };
}
function updateMovingObstacles(dt){
  if (!moveChk.checked) return;
  const sp = +moveSpeedRange.value;
  if (sp <= 0) return;
  const carRect = carClearRect();
  /* 圆形保护区(消除正方形对角线漏洞:正方形角向可漏进 24px 膨胀内) */
  const goalRect = { x: goal.x - GOAL_CLEAR, y: goal.y - GOAL_CLEAR, w: GOAL_CLEAR*2, h: GOAL_CLEAR*2 };
  const startRect = { x: start.x - START_R, y: start.y - START_R, w: START_R*2, h: START_R*2 };
  // 空间桶:大障碍数量下避免全对碰撞检查
  const BS = 200;
  const buckets = new Map();
  for (const o of world.obstacles){
    const bx = Math.floor(o.x/BS), by = Math.floor(o.y/BS);
    const k = bx + ',' + by;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(o);
  }
  const blockedByOthers = (nx, ny, w, h, self) => {
    const x0 = Math.floor(nx/BS), x1 = Math.floor((nx+w)/BS);
    const y0 = Math.floor(ny/BS), y1 = Math.floor((ny+h)/BS);
    for (let by=y0;by<=y1;by++) for (let bx=x0;bx<=x1;bx++){
      const arr = buckets.get(bx + ',' + by);
      if (!arr) continue;
      for (const other of arr){
        if (other === self) continue;
        if (aabbHit({ x:nx, y:ny, w:w, h:h }, other)) return true;
      }
    }
    return false;
  };
  for (const o of world.obstacles){
    // 巡逻模式(手动路径点)优先
    if (o.patrol && o.patrol.length >= 2){
      const target = o.patrol[o.patrolIdx % o.patrol.length];
      const dx = target.x - o.x, dy = target.y - o.y;
      const d = Math.hypot(dx, dy);
      if (d < 2){
        o.patrolIdx = (o.patrolIdx + 1) % o.patrol.length;
      } else {
        // 巡逻途中也避免与其他障碍及小车重叠
        const nx = o.x + dx/d*sp*dt, ny = o.y + dy/d*sp*dt;
        const nrect = { x:nx, y:ny, w:o.w, h:o.h };
        let clear = !blockedByOthers(nx, ny, o.w, o.h, o);
        if (clear && aabbHit(nrect, carRect)) clear = false;
        if (clear && circleRectHit(goal.x, goal.y, GOAL_CLEAR, nrect)) clear = false;
        if (clear && circleRectHit(start.x, start.y, START_R, nrect)) clear = false;
        if (clear && nx >= 0 && nx+o.w <= W && ny >= 0 && ny+o.h <= H){ o.x = nx; o.y = ny; }
      }
      continue;
    }
    // 随机移动模式(有速度向量)
    if (o.vel){
      // 碰墙反弹
      if (o.x <= 0) o.vel.vx = Math.abs(o.vel.vx);
      if (o.x + o.w >= W) o.vel.vx = -Math.abs(o.vel.vx);
      if (o.y <= 0) o.vel.vy = Math.abs(o.vel.vy);
      if (o.y + o.h >= H) o.vel.vy = -Math.abs(o.vel.vy);
      const carD = Math.hypot(car.x-(o.x+o.w/2), car.y-(o.y+o.h/2));
      // 车接近时:闪避模式(加速 + 远离车方向优先)
      const flee = carD < 150;
      const stepSp = flee ? Math.min(420, sp*6) : sp;
      let cands = [
        [o.vel.vx, o.vel.vy],
        [-o.vel.vx, o.vel.vy],
        [o.vel.vx, -o.vel.vy],
        [-o.vel.vx, -o.vel.vy]
      ];
      if (flee){
        cands.sort((a,b) => {
          const da = Math.hypot((o.x+a[0]*stepSp*dt)-car.x, (o.y+a[1]*stepSp*dt)-car.y);
          const db = Math.hypot((o.x+b[0]*stepSp*dt)-car.x, (o.y+b[1]*stepSp*dt)-car.y);
          return db - da; /* 远离车(距离大)优先 */
        });
      }
      let moved = false;
      for (const [vx, vy] of cands){
        const nx = o.x + vx*stepSp*dt, ny = o.y + vy*stepSp*dt;
        if (nx < 0 || nx+o.w > W || ny < 0 || ny+o.h > H) continue;
        const nrect = { x:nx, y:ny, w:o.w, h:o.h };
        let clear = !blockedByOthers(nx, ny, o.w, o.h, o);
        if (clear && aabbHit(nrect, carRect)) clear = false;
        if (clear && circleRectHit(goal.x, goal.y, GOAL_CLEAR, nrect)) clear = false;
        if (clear && circleRectHit(start.x, start.y, START_R, nrect)) clear = false;
        if (clear){
          o.x = nx; o.y = ny;
          o.vel.vx = vx; o.vel.vy = vy;
          moved = true;
          break;
        }
      }
      if (!moved){ o.vel.vx *= -1; o.vel.vy *= -1; }
    }
  }
}
function makeRandomVel(){
  const a = Math.random()*Math.PI*2;
  return { vx: Math.cos(a), vy: Math.sin(a) };
}
function doReplan(){
  if (!algo || algo.id !== 'dlite' || !dliteDirty) return;
  const after = blockedSet();
  const changed = diffBlocked(algo.blockedBefore, after);
  algo.blockedBefore = after;
  if (workerOk) postWorkerReplanDlite(changed, after);
  else algo.replan(changed);
  dliteDirty = false; btnReplan.disabled = true;
  mode = 'searching'; running = true;
  actionText('D* Lite:增量重规划…');
}

/* 采样类渲染分组(按算法族而非逐个 id 判断) */
const SAMPLE_GRAPH_IDS = new Set(['prm','prmstar','fmt','vgraph']);
const RRT_TREE_IDS = new Set(['rrt','rrtstar','informedrrt','rrtsmart']);

/* ============ 指标面板 ============ */
function renderMetrics(){
  let html = '<div class="m-head"><span>算法</span><span>长度(px)</span><span>扩展</span><span>耗时</span><span>碰撞</span></div>';
  if (!metricsLive.alg && !metricsHistory.length) html += '<div class="m-empty">运行算法后在此显示遥测数据</div>';
  if (metricsLive.alg){
    html += '<div class="m-row live"><span>'+metricsLive.alg+'</span><span>'+metricsLive.pathLen.toFixed(0)+'</span><span>'+metricsLive.expanded+'</span><span>'+metricsLive.timeMs.toFixed(0)+'ms</span><span>'+metricsLive.collisions+'</span></div>';
  }
  for (const r of metricsHistory){
    html += '<div class="m-row"><span>'+r.alg+'</span><span>'+r.pathLen.toFixed(0)+'</span><span>'+r.expanded+'</span><span>'+r.timeMs.toFixed(0)+'ms</span><span>'+r.collisions+'</span></div>';
  }
  metricsEl.innerHTML = html;
}

/* ============ 渲染 ============ */
function rectInView(x,y,w,h,view){
  return x < view.x1 && x+w > view.x0 && y < view.y1 && y+h > view.y0;
}
function cellRect(cell, ctx, view){
  const x = cell.x*GRID, y = cell.y*GRID;
  if (!rectInView(x,y,GRID,GRID,view)) return;
  ctx.fillRect(x,y,GRID,GRID);
}
function drawAlgoLayers(ctx, view){
  const c = COLORS;
  // 蚁群信息素(琥珀浓度)
  if (algo && algo.id === 'aco' && algo.pheromone){
    ctx.fillStyle = '#d99a2b';
    const x0 = Math.max(0, Math.floor(view.x0/GRID)), x1 = Math.min(grid.cols-1, Math.floor(view.x1/GRID));
    const y0 = Math.max(0, Math.floor(view.y0/GRID)), y1 = Math.min(grid.rows-1, Math.floor(view.y1/GRID));
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      const t = algo.pheromone[y*grid.cols+x];
      if (t > 0.13){
        ctx.globalAlpha = Math.min(0.7, (t-0.1)*4);
        ctx.fillRect(x*GRID, y*GRID, GRID, GRID);
      }
    }
    ctx.globalAlpha = 1;
  }
  if (vis.replanCells.size){
    ctx.fillStyle = c.replan;
    for (const cell of vis.replanCells.values()) cellRect(cell, ctx, view);
  }
  if (vis.backClosed.size){
    ctx.fillStyle = c.backClosed; ctx.globalAlpha = 0.5;
    for (const cell of vis.backClosed.values()) cellRect(cell, ctx, view);
    ctx.globalAlpha = 1;
  }
  if (vis.backOpen.size){
    ctx.fillStyle = c.backOpen; ctx.globalAlpha = 0.55;
    for (const cell of vis.backOpen.values()) cellRect(cell, ctx, view);
    ctx.globalAlpha = 1;
  }
  if (vis.closedCells.size){
    ctx.fillStyle = c.closed; ctx.globalAlpha = 0.5;
    for (const cell of vis.closedCells.values()) cellRect(cell, ctx, view);
    ctx.globalAlpha = 1;
  }
  if (vis.openCells.size){
    ctx.fillStyle = c.open; ctx.globalAlpha = 0.55;
    for (const cell of vis.openCells.values()) cellRect(cell, ctx, view);
    ctx.globalAlpha = 1;
  }
  // 网格搜索/D* Lite 树边
  if (vis.edges.length){
    ctx.strokeStyle = c.edge; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const ed of vis.edges){
      if (!rectInView(Math.min(ed.x1,ed.x2), Math.min(ed.y1,ed.y2), Math.abs(ed.x2-ed.x1)+1, Math.abs(ed.y2-ed.y1)+1, view)) continue;
      ctx.moveTo(ed.x1,ed.y1); ctx.lineTo(ed.x2,ed.y2);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // PRM / 可见性图 边
  if (algo && SAMPLE_GRAPH_IDS.has(algo.id) && algo.edges && algo.samples && algo.edges.length){
    ctx.strokeStyle = '#aab2bd'; ctx.lineWidth = 1; ctx.globalAlpha = 0.7;
    ctx.beginPath();
    for (const ed of algo.edges){
      const pa = algo.samples[ed[0]], pb = algo.samples[ed[1]];
      if (!pa || !pb) continue;
      if (!rectInView(Math.min(pa.x,pb.x), Math.min(pa.y,pb.y), Math.abs(pb.x-pa.x)+1, Math.abs(pb.y-pa.y)+1, view)) continue;
      ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // RRT 树
  if (algo && RRT_TREE_IDS.has(algo.id) && algo.nodes && algo.edges){
    ctx.lineWidth = 1.2;
    for (const ed of algo.edges){
      const na = algo.nodes[ed.a], nb = algo.nodes[ed.b];
      if (!na || !nb) continue;
      ctx.strokeStyle = ed.kind === 'rewire' ? c.rewire : c.tree;
      ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y); ctx.stroke();
    }
    ctx.fillStyle = '#8a94a6';
    for (const n of algo.nodes){
      if (!rectInView(n.x,n.y,1,1,view)) continue;
      ctx.beginPath(); ctx.arc(n.x,n.y,2,0,7); ctx.fill();
    }
  }
  // RRT-Connect 双树(树A 蓝灰 / 树B 橙 / 连接绿)
  if (algo && algo.id === 'rrtconnect' && algo.edges && algo.treeA && algo.treeB){
    ctx.lineWidth = 1.2;
    for (const ed of algo.edges){
      let na, nb;
      if (ed.tree === 'conn'){ na = algo.treeA[ed.a]; nb = algo.treeB[ed.b]; }
      else { const t = ed.tree === 'A' ? algo.treeA : algo.treeB; na = t[ed.a]; nb = t[ed.b]; }
      if (!na || !nb) continue;
      if (!rectInView(Math.min(na.x,nb.x), Math.min(na.y,nb.y), Math.abs(nb.x-na.x)+1, Math.abs(nb.y-na.y)+1, view)) continue;
      ctx.strokeStyle = ed.tree === 'conn' ? c.path : (ed.tree === 'A' ? c.tree : '#f0a35e');
      ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y); ctx.stroke();
    }
    for (const t of [algo.treeA, algo.treeB]){
      ctx.fillStyle = t === algo.treeA ? '#8a94a6' : '#d9832e';
      for (const n of t){
        if (!rectInView(n.x,n.y,1,1,view)) continue;
        ctx.beginPath(); ctx.arc(n.x,n.y,2,0,7); ctx.fill();
      }
    }
  }
  // 混合 A* 轨迹
  if (vis.trajs.length){
    ctx.strokeStyle = c.traj; ctx.lineWidth = 1.5;
    for (const ps of vis.trajs){
      if (!rectInView(ps[0].x, ps[0].y, 1, 1, view)) continue;
      ctx.beginPath();
      for (let i=0;i<ps.length;i++){ if (i===0) ctx.moveTo(ps[i].x,ps[i].y); else ctx.lineTo(ps[i].x,ps[i].y); }
      ctx.stroke();
    }
  }
  // PRM 采样点
  if (vis.samples.length){
    ctx.fillStyle = c.sample;
    for (const p of vis.samples){
      if (!rectInView(p.x,p.y,1,1,view)) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
    }
  }
  // PRM 搜索 open/closed
  if (vis.prmOpen.size){
    ctx.fillStyle = c.open; ctx.globalAlpha = 0.6;
    for (const p of vis.prmOpen.values()){
      if (!rectInView(p.x,p.y,1,1,view)) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (vis.prmClosed.size){
    ctx.fillStyle = c.closed; ctx.globalAlpha = 0.6;
    for (const p of vis.prmClosed.values()){
      if (!rectInView(p.x,p.y,1,1,view)) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 当前扩展点(实心点 + 脉冲环)
  if (vis.current){
    ctx.fillStyle = c.current;
    ctx.beginPath(); ctx.arc(vis.current.x, vis.current.y, 5, 0, 7); ctx.fill();
    const ph = (performance.now() % 900) / 900;
    ctx.strokeStyle = 'rgba(251,140,76,' + (0.85*(1-ph)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(vis.current.x, vis.current.y, 6 + ph*18, 0, 7); ctx.stroke();
  }
  // 蚁群蚂蚁(A 群紫 / B 群橙)
  if (algo && algo.id === 'aco' && algo.antsA){
    const groups = [ [algo.antsA, '#8a4baf'], [algo.antsB, '#d9832e'] ];
    for (const [ants, color] of groups){
      ctx.fillStyle = color;
      for (const ant of ants){
        if (ant.done) continue;
        const cc = grid.cellCenter(ant);
        if (!rectInView(cc.x,cc.y,1,1,view)) continue;
        ctx.beginPath(); ctx.arc(cc.x, cc.y, 3.5, 0, 7); ctx.fill();
      }
    }
  }
  // 最终路径(两种材质 + 新解揭示动画)
  if (vis.path.length >= 2) drawPath2D(ctx, vis.path);
}
/* 路径材质:line = 绿色实线;fsd = FSD 式引导带(近车浓、远端淡 + 流动箭头) */
function drawPath2D(ctx, P){
  const now = performance.now();
  /* 弧长参数化 */
  const cum = new Float64Array(P.length); cum[0] = 0;
  for (let i=1;i<P.length;i++) cum[i] = cum[i-1] + Math.hypot(P[i].x-P[i-1].x, P[i].y-P[i-1].y);
  const total = cum[P.length-1];
  if (!(total > 0)) return;
  /* 揭示动画:新解沿途点亮(0.7s,ease-out) */
  let reveal = 1;
  if (vis.pathT0){
    reveal = Math.min(1, (now - vis.pathT0) / 700);
    if (reveal >= 1) vis.pathT0 = 0;
  }
  const shown = total * (reveal >= 1 ? 1 : 1 - Math.pow(1-reveal, 3));
  /* 取任意弧长处的点与切向(二分定位) */
  const at = (d) => {
    let lo = 0, hi = P.length-1;
    while (lo < hi){ const mid = (lo+hi) >> 1; if (cum[mid] < d) lo = mid+1; else hi = mid; }
    const i = Math.max(1, lo), f = (d - cum[i-1]) / Math.max(1e-6, cum[i]-cum[i-1]);
    const a = P[i-1], b = P[i];
    return { x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f, dx:b.x-a.x, dy:b.y-a.y };
  };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  /* 世界→屏幕折算:线宽恒定于屏幕(不随缩放变细/变粗) */
  const zk = 1 / Math.max(0.05, cam.scale);
  if (pathStyle === 'fsd'){
    /* FSD 式引导线:自车头向前延伸的蓝色光束,远端溶解(材质采样自真实 FSD 截图)
       画法:沿弧长分块填充多边形带 —— 块间共享边(无缝隙/无端帽重叠),
            透明度按弧长取值(不用跨画布的线性渐变,折角处不会出现色彩跳变) */
    let sCar = 0, bestD = Infinity;
    for (let i=0;i<P.length;i++){
      const dd = (P[i].x-car.x)*(P[i].x-car.x) + (P[i].y-car.y)*(P[i].y-car.y);
      if (dd < bestD){ bestD = dd; sCar = cum[i]; }
    }
    const span = shown - sCar;
    if (span > 6*zk){
      const N = Math.max(24, Math.min(120, Math.round(span / (9*zk))));
      const stepD = span / N;
      const pts = [];
      for (let i=0;i<=N;i++) pts.push(at(sCar + i*stepD));
      /* 每点的单位法向(相邻采样切向平均,折角处取斜接) */
      const nrm = [];
      for (let i=0;i<=N;i++){
        const a = pts[Math.max(i-1,0)], b = pts[Math.min(i+1,N)];
        let tx = b.x - a.x, ty = b.y - a.y;
        const tl = Math.hypot(tx,ty) || 1; tx /= tl; ty /= tl;
        nrm.push([-ty, tx]);
      }
      /* 弧长→透明度:前段保持实,靠近远端溶解 */
      const fadeAt = (d) => Math.pow(Math.max(0, 1 - Math.min(1, (d - sCar) / span)), 1.7);
      /* 三层带宽叠出羽化边;色谱 rgb(0,118,244) */
      const bands = [
        { hw: 19*zk, a: 0.13, c: '0,118,244' },
        { hw: 12*zk, a: 0.32, c: '0,118,244' },
        { hw: 5*zk,  a: 0.95, c: '10,124,246' }
      ];
      const K = 16, per = Math.max(1, Math.round(N / K));
      for (const B of bands){
        for (let s0=0; s0<N; s0+=per){
          const s1 = Math.min(s0+per, N);
          const mid = sCar + ((s0 + (s1-s0)/2) * stepD);
          const al = (B.a * fadeAt(mid)).toFixed(3);
          if (al <= 0.002) continue;
          ctx.fillStyle = 'rgba(' + B.c + ',' + al + ')';
          ctx.beginPath();
          /* 左边缘顺行 */
          for (let i=s0;i<=s1;i++){ const x = pts[i].x + nrm[i][0]*B.hw, y = pts[i].y + nrm[i][1]*B.hw; i===s0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
          /* 右边缘逆行 */
          for (let i=s1;i>=s0;i--){ ctx.lineTo(pts[i].x - nrm[i][0]*B.hw, pts[i].y - nrm[i][1]*B.hw); }
          ctx.closePath(); ctx.fill();
        }
      }
    }
  } else {
    /* 绿色实线 + 轻辉光 */
    const stroke = () => {
      ctx.beginPath();
      ctx.moveTo(P[0].x, P[0].y);
      for (let i=1;i<P.length;i++){
        if (cum[i] > shown){
          const p = at(shown);
          ctx.lineTo(p.x, p.y); break;
        }
        ctx.lineTo(P[i].x, P[i].y);
      }
      ctx.stroke();
    };
    ctx.save();
    ctx.strokeStyle = 'rgba(6,14,26,.5)'; ctx.lineWidth = 8.5*zk; stroke(); /* 轮廓 */
    ctx.shadowColor = 'rgba(46,204,143,.6)'; ctx.shadowBlur = 14;
    ctx.strokeStyle = COLORS.path; ctx.lineWidth = 5*zk; stroke();
    ctx.restore();
  }
  /* 揭示头部光点 */
  if (reveal < 1){
    const h = at(shown);
    ctx.save();
    ctx.fillStyle = pathStyle === 'fsd' ? '#9adcff' : '#5ff0b0';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(h.x, h.y, 5.5, 0, 7); ctx.fill();
    ctx.restore();
  }
}
function drawCar(ctx){
  if (!car) return;
  const flash = (mode === 'failed' && car.collided) && (performance.now()-flashStart < 1000) && (Math.floor(performance.now()/100)%2 === 0);
  const L = CAR_L, HW = CAR_W/2;
  ctx.save();
  ctx.translate(car.x, car.y); ctx.rotate(car.theta);
  /* 航向光锥(读向性) */
  const cone = ctx.createLinearGradient(L/2, 0, L/2+70, 0);
  cone.addColorStop(0, 'rgba(120,200,255,.20)'); cone.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = cone;
  ctx.beginPath(); ctx.moveTo(L/2-4, -6); ctx.lineTo(L/2+70, -30); ctx.lineTo(L/2+70, 30); ctx.lineTo(L/2-4, 6);
  ctx.closePath(); ctx.fill();
  /* 四轮(前轮随转向角) */
  const wheel = (wx, wy, ang) => {
    ctx.save(); ctx.translate(wx, wy); ctx.rotate(ang);
    ctx.fillStyle = COLORS.wheel;
    ctx.beginPath(); ctx.roundRect(-5, -3.6, 10, 7.2, 2.4); ctx.fill();
    ctx.restore();
  };
  wheel(WHEELBASE/2, -HW+1.5, car.delta); wheel(WHEELBASE/2, HW-1.5, car.delta);
  wheel(-WHEELBASE/2, -HW+1.5, 0); wheel(-WHEELBASE/2, HW-1.5, 0);
  /* 车身(上缘受光,下缘渐暗) */
  const body = ctx.createLinearGradient(0, -HW, 0, HW);
  body.addColorStop(0, flash ? COLORS.flash : '#7ab8ff');
  body.addColorStop(0.45, flash ? COLORS.flash : COLORS.car);
  body.addColorStop(1, flash ? COLORS.flash : '#1f5cb8');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.roundRect(-L/2, -HW, L, CAR_W, 8); ctx.fill();
  ctx.strokeStyle = COLORS.carEdge; ctx.lineWidth = 1.4; ctx.stroke();
  /* 座舱玻璃 + 挡风高光 */
  ctx.fillStyle = 'rgba(12,22,38,.85)';
  ctx.beginPath(); ctx.roundRect(-L/2+13, -HW+5, 26, CAR_W-10, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(150,205,255,.45)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(180,220,255,.22)';
  ctx.beginPath(); ctx.roundRect(-L/2+15, -HW+6.5, 7, CAR_W-13, 3); ctx.fill();
  /* 前照灯(带辉光) */
  ctx.fillStyle = '#eaf7ff';
  ctx.shadowColor = 'rgba(180,230,255,.9)'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.roundRect(L/2-9, -HW+3.5, 5, 6, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(L/2-9, HW-9.5, 5, 6, 2); ctx.fill();
  /* 尾灯 */
  ctx.shadowColor = 'rgba(255,80,110,.85)'; ctx.fillStyle = '#ff5a72';
  ctx.beginPath(); ctx.roundRect(-L/2+4, -HW+3.5, 4, 5.5, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-L/2+4, HW-9, 4, 5.5, 2); ctx.fill();
  /* 倒车灯(车尾白色):倒车时点亮,和真车一致 */
  if (carReverse){
    ctx.shadowColor = 'rgba(225,245,255,.95)'; ctx.fillStyle = '#f4fbff';
    ctx.beginPath(); ctx.roundRect(-L/2+4, -HW+10.5, 4, 5.5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-L/2+4, HW-16, 4, 5.5, 2); ctx.fill();
  }
  ctx.restore();
}
function render(){
  c2.fillStyle = COLORS.outside; c2.fillRect(0,0,vw,vh);
  c2.save();
  c2.translate(vw/2, vh/2);
  c2.scale(cam.scale, cam.scale);
  c2.translate(-cam.x, -cam.y);
  const view = {
    x0: (0-vw/2)/cam.scale + cam.x, x1: (vw-vw/2)/cam.scale + cam.x,
    y0: (0-vh/2)/cam.scale + cam.y, y1: (vh-vh/2)/cam.scale + cam.y
  };
  // 世界背景
  c2.fillStyle = COLORS.bg; c2.fillRect(0,0,W,H);
  // 网格线
  if (cam.scale >= 0.8){
    c2.strokeStyle = COLORS.gridLine; c2.lineWidth = 1;
    c2.beginPath();
    for (let x=GRID;x<W;x+=GRID){ if (x<view.x0||x>view.x1) continue; c2.moveTo(x,Math.max(view.y0,0)); c2.lineTo(x,Math.min(view.y1,H)); }
    for (let y=GRID;y<H;y+=GRID){ if (y<view.y0||y>view.y1) continue; c2.moveTo(Math.max(view.x0,0),y); c2.lineTo(Math.min(view.x1,W),y); }
    c2.stroke();
  }
  c2.strokeStyle = COLORS.worldBorder; c2.lineWidth = 2; c2.strokeRect(0,0,W,H);
  // 障碍物
  for (const o of world.obstacles){
    if (!rectInView(o.x,o.y,o.w,o.h,view)) continue;
    c2.beginPath(); c2.roundRect(o.x, o.y, o.w, o.h, 3);
    c2.fillStyle = COLORS.obstacle; c2.fill();
    c2.strokeStyle = COLORS.obstacleEdge; c2.lineWidth = 1; c2.stroke();
  }
  // 选中障碍(移动路径编辑)
  if (selectedObstacle){
    c2.strokeStyle = '#f5a623'; c2.lineWidth = 3;
    c2.strokeRect(selectedObstacle.x, selectedObstacle.y, selectedObstacle.w, selectedObstacle.h);
    if (selectedObstacle.patrol && selectedObstacle.patrol.length){
      c2.setLineDash([6,4]); c2.strokeStyle = '#f5a623'; c2.lineWidth = 1.5;
      c2.beginPath();
      c2.moveTo(selectedObstacle.x+selectedObstacle.w/2, selectedObstacle.y+selectedObstacle.h/2);
      for (const p of selectedObstacle.patrol) c2.lineTo(p.x, p.y);
      c2.stroke(); c2.setLineDash([]);
      for (const p of selectedObstacle.patrol){
        c2.beginPath(); c2.arc(p.x, p.y, 5, 0, 7);
        c2.strokeStyle = '#f5a623'; c2.lineWidth = 2; c2.stroke();
        c2.fillStyle = '#fff'; c2.fill();
      }
    }
  }
  drawAlgoLayers(c2, view);
  // 视线限制:盖住未见区域(本帧可见=透明,记忆=半透明,从未看到=全黑)
  if (perceptionOn){
    if (fogDirty){ paintFog(); fogDirty = false; }
    c2.save();
    c2.imageSmoothingEnabled = false;
    c2.drawImage(fogCv, 0, 0, W, H);
    c2.restore();
  }
  // 拖拽放置预览
  if (mouse.mode === 'place' && mouse.startW && mouse.curW){
    const x = Math.min(mouse.startW.x,mouse.curW.x), y = Math.min(mouse.startW.y,mouse.curW.y);
    const w = Math.abs(mouse.curW.x-mouse.startW.x), h = Math.abs(mouse.curW.y-mouse.startW.y);
    c2.strokeStyle = COLORS.current; c2.lineWidth = 1.5; c2.setLineDash([5,4]);
    c2.strokeRect(x,y,w,h); c2.setLineDash([]);
    c2.fillStyle = 'rgba(255,138,92,.15)'; c2.fillRect(x,y,w,h);
  }
  // 起点 / 终点
  c2.fillStyle = COLORS.start;
  c2.beginPath(); c2.arc(start.x,start.y,10,0,7); c2.fill();
  c2.strokeStyle = '#fff'; c2.lineWidth = 2; c2.stroke();
  c2.save(); c2.translate(goal.x,goal.y); c2.rotate(Math.PI/4);
  c2.fillStyle = COLORS.goal; c2.fillRect(-10,-10,20,20);
  c2.strokeStyle = '#fff'; c2.lineWidth = 2; c2.strokeRect(-10,-10,20,20);
  c2.restore();
  // APF 合力箭头
  if (vis.force){
    c2.strokeStyle = COLORS.force; c2.lineWidth = 3;
    c2.beginPath(); c2.moveTo(vis.force.x,vis.force.y); c2.lineTo(vis.force.x+vis.force.fx, vis.force.y+vis.force.fy); c2.stroke();
    const ang = Math.atan2(vis.force.fy, vis.force.fx);
    c2.beginPath();
    c2.moveTo(vis.force.x+vis.force.fx, vis.force.y+vis.force.fy);
    c2.lineTo(vis.force.x+vis.force.fx-9*Math.cos(ang-0.5), vis.force.y+vis.force.fy-9*Math.sin(ang-0.5));
    c2.lineTo(vis.force.x+vis.force.fx-9*Math.cos(ang+0.5), vis.force.y+vis.force.fy-9*Math.sin(ang+0.5));
    c2.closePath(); c2.fillStyle = COLORS.force; c2.fill();
  }
  drawCar(c2);
  c2.restore();
}

/* ============ 播放态与移动门控(strict 模式下必须顶层声明,块内声明不外泄) ============ */
let pbState = '';
/* 空闲时禁用 播放/暂停/单步,运行中高亮"暂停",消除"点了没反应" */
function syncPlaybackUI(){
  /* 已到达终点且有路径时可重播,故同样视为可控制 */
  const hasTrack = !!(tracker && tracker.pts && tracker.pts.length >= 2);
  const active = (mode === 'searching' || mode === 'following' || (mode === 'arrived' && hasTrack));
  const key = active + ':' + running + ':' + mode;
  if (key === pbState) return;
  pbState = key;
  btnPlay.disabled = !active || running;
  btnPause.disabled = !active || !running;
  btnStep.disabled = !active || (running && mode === 'searching');
  btnPause.classList.toggle('ctl-on', active && running && mode !== 'arrived');
}
/* 移动障碍门控:未启用移动时,持续寻路/随机移动不可用 */
function syncMoveGate(){
  const on = moveChk.checked;
  persistChk.disabled = !on;
  btnRandomMove.disabled = !on;
  if (!on) persistChk.checked = false;
}

/* ============ 主循环 ============ */
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (t-lastT)/1000 || 0.016);
  lastT = t;
  if (mode === 'searching' && running && algo){
    if (workerOk){
      /* Worker 路径:增量已在 onmessage 立即消费,此处只处理完成/巡航 */
      if (algo.done){
        afterSearchDone();
      } else if (replanning && tracker && mode === 'searching'){
        // 重规划进行中:车沿旧轨迹持续巡航,保持设定速度
        car.v = +speedRange.value;
        car.delta = trackerSteer();
        carStep(car, dt*speedMult);
        if (vehicleCollides(car, world.obstacles)){
          if (!handleCarCollision()) return; /* 撞静态 → 已 fail */
          /* 撞移动 → 重规划已在搜索中,本帧不动 */
        }
      }
    } else {
      // 同步路径:每帧步数上限(1×=80 步,探索动画清晰可见;倍速平方放大快进)
      // 时间预算兜底:重规划 6ms 保流畅,手动搜索 15ms
      const stepLimit = Math.max(80, 80 * speedMult * speedMult);
      const budget = replanning ? 6 : 15;
      const bStart = performance.now();
      let steps = 0;
      while (performance.now() - bStart < budget && steps < stepLimit && !algo.done){
        handleEvents(algo.step());
        steps++;
      }
      if (algo.done) afterSearchDone();
      else if (replanning && tracker && mode === 'searching'){
        // 重规划进行中:车沿旧轨迹持续巡航,保持设定速度
        car.v = +speedRange.value;
        car.delta = trackerSteer();
        carStep(car, dt*speedMult);
        if (vehicleCollides(car, world.obstacles)){
          if (!handleCarCollision()) return; /* 撞静态 → 已 fail */
          /* 撞移动 → 重规划已在搜索中,本帧不动 */
        }
      }
    }
  } else if (mode === 'following'){
    acc += dt;
    while (acc >= 1/60){
      followStep(1/60);
      acc -= 1/60;
      if (mode !== 'following'){ acc = 0; break; }
    }
  }
  if (mode === 'searching' && algo && algo.metrics){
    metricsLive.expanded = algo.metrics.expanded;
    metricsLive.timeMs = workerOk ? (algo.metrics.timeMs || 0) : (performance.now() - algo.t0);
    if (performance.now() - lastMetricsRender > 200){ lastMetricsRender = performance.now(); renderMetrics(); }
  }
  // 相机跟随(行驶/重规划巡航期间始终跟随车,避免视角跳变)
  if (mode === 'following' || (replanning && mode === 'searching')){ cam.x = car.x; cam.y = car.y; }
  updateMovingObstacles(dt);
  /* 感知:按当帧障碍位置重算阴影与记忆;新看到障碍 → 触发重规划 */
  updatePerception();
  if (perceptionDirty && mode === 'following') tryReplan(true);
  render();
  syncPlaybackUI();
}

/* ============ 输入(仅主线程) ============ */
if (!IS_WORKER){
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { sx: e.clientX-r.left, sy: e.clientY-r.top };
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { sx, sy } = canvasPos(e);
  const before = s2w(sx,sy);
  cam.scale = clamp(cam.scale*(e.deltaY<0?1.1:1/1.1), 0.15, 4);
  const after = s2w(sx,sy);
  cam.x += before.x-after.x; cam.y += before.y-after.y;
}, { passive:false });
canvas.addEventListener('mousedown', e => {
  const { sx, sy } = canvasPos(e);
  const t = document.querySelector('input[name=tool]:checked').value;
  if (e.button === 0){
    if (t === 'patrol'){
      if (!moveChk.checked){ actionText('请先勾选"启用移动",再编辑障碍移动路径'); return; }
      const w = s2w(sx,sy);
      let hit = null;
      for (let i=0;i<world.obstacles.length;i++){
        const o = world.obstacles[i];
        if (w.x>=o.x && w.x<=o.x+o.w && w.y>=o.y && w.y<=o.y+o.h){ hit = o; break; }
      }
      if (hit){
        selectedObstacle = (selectedObstacle === hit) ? null : hit;
        actionText(selectedObstacle ? '已选中障碍,点击空地添加路径点' : '已取消选中');
      } else if (selectedObstacle){
        if (!selectedObstacle.patrol) selectedObstacle.patrol = [];
        selectedObstacle.patrol.push({ x:w.x, y:w.y });
        selectedObstacle.patrolIdx = 0;
        selectedObstacle.vel = null;
        actionText('已添加路径点 #'+selectedObstacle.patrol.length+'('+w.x.toFixed(0)+','+w.y.toFixed(0)+')');
      } else {
        actionText('请先点击一个障碍物进行选择');
      }
      return;
    } else if (t === 'place'){
      mouse.down = true; mouse.panning = false; mouse.mode = 'place'; mouse.moved = false;
      mouse.startW = s2w(sx,sy); mouse.curW = null; mouse.button = 0;
    } else if (t === 'delete'){
      const w = s2w(sx,sy);
      if (deleteObstacleAt(w.x,w.y)){ actionText('已删除障碍物'); return; }
      mouse.down = true; mouse.panning = true; mouse.mode = null; mouse.moved = false;
      mouse.lastS = [sx,sy]; mouse.button = 0;
    } else {
      mouse.down = true; mouse.panning = true; mouse.mode = 'goal'; mouse.moved = false;
      mouse.lastS = [sx,sy]; mouse.button = 0;
    }
  } else {
    mouse.down = true; mouse.panning = true; mouse.mode = null; mouse.moved = false;
    mouse.lastS = [sx,sy]; mouse.button = e.button;
  }
});
canvas.addEventListener('mousemove', e => {
  if (!mouse.down) return;
  const { sx, sy } = canvasPos(e);
  if (mouse.mode === 'place'){
    mouse.curW = s2w(sx,sy);
    if (mouse.lastS && Math.abs(sx-mouse.lastS[0])+Math.abs(sy-mouse.lastS[1]) > 2) mouse.moved = true;
    if (!mouse.lastS) mouse.lastS = [sx,sy];
  } else if (mouse.panning){
    const dx = sx-mouse.lastS[0], dy = sy-mouse.lastS[1];
    if (Math.abs(dx)+Math.abs(dy) > 2) mouse.moved = true;
    cam.x -= dx/cam.scale;
    cam.y -= dy/cam.scale;
    mouse.lastS = [sx,sy];
  }
});
canvas.addEventListener('mouseup', e => {
  if (!mouse.down) return;
  const { sx, sy } = canvasPos(e);
  if (mouse.mode === 'place' && mouse.startW && mouse.curW){
    const x = Math.min(mouse.startW.x,mouse.curW.x), y = Math.min(mouse.startW.y,mouse.curW.y);
    const w = Math.abs(mouse.curW.x-mouse.startW.x), h = Math.abs(mouse.curW.y-mouse.startW.y);
    if (w >= 20 && h >= 20){
      if (placeObstacle({ x, y, w, h })) actionText('已放置障碍物');
      else actionText('放置失败:与障碍重叠或覆盖起点/终点');
    } else actionText('障碍物过小(至少 20×20)');
  } else if (mouse.mode === 'goal' && !mouse.moved){
    const w = s2w(sx,sy);
    setGoal(w.x, w.y);
  }
  mouse.down = false; mouse.panning = false; mouse.mode = null; mouse.startW = null; mouse.curW = null;
});

/* 滑条填充进度(自定义轨道渐变) */
document.querySelectorAll('input[type=range]').forEach(r => {
  const updFill = () => r.style.setProperty('--fill', ((r.value - r.min) / (r.max - r.min) * 100) + '%');
  r.addEventListener('input', updFill); updFill();
});
speedRange.addEventListener('input', () => { speedVal.textContent = speedRange.value; });
steerRange.addEventListener('input', () => { steerVal.textContent = steerRange.value + '°'; });
manualChk.addEventListener('change', () => {
  manualSteer = manualChk.checked;
  steerRange.disabled = !manualSteer;
});
moveSpeedRange.addEventListener('input', () => { moveSpeedVal.textContent = moveSpeedRange.value; });
btnRandomMove.addEventListener('click', () => {
  if (!moveChk.checked){ actionText('请先勾选"启用移动"'); return; }
  if (selectedObstacle){
    const o = selectedObstacle;
    o.patrol = null; o.patrolIdx = 0;
    o.vel = makeRandomVel();
    actionText('已设置该障碍随机移动');
  } else {
    let n = 0;
    for (const o of world.obstacles){
      o.patrol = null; o.patrolIdx = 0;
      o.vel = makeRandomVel();
      n++;
    }
    actionText('已设置全部 '+n+' 个障碍随机移动');
  }
});
btnClearPatrol.addEventListener('click', () => {
  if (selectedObstacle){
    selectedObstacle.patrol = null;
    selectedObstacle.patrolIdx = 0;
    selectedObstacle.vel = null;
    actionText('已清除选中障碍的移动设置');
  } else {
    let n = 0;
    for (const o of world.obstacles){
      o.patrol = null; o.patrolIdx = 0;
      o.vel = null;
      n++;
    }
    actionText('已清除全部 '+n+' 个障碍的移动设置');
  }
});
document.querySelectorAll('input[name=path]').forEach(r => r.addEventListener('change', () => { pathMode = document.querySelector('input[name=path]:checked').value; }));
document.querySelectorAll('input[name=pathStyle]').forEach(r => r.addEventListener('change', () => { pathStyle = document.querySelector('input[name=pathStyle]:checked').value; }));
/* 感知:视角切换 / 视野半径 / 未知区代价 */
document.querySelectorAll('input[name=perception]').forEach(r => r.addEventListener('change', () => {
  perceptionOn = document.querySelector('input[name=perception]:checked').value === 'on';
  resetPerception();
  grid.buildFromWorld(); /* 网格随视角在"真实障碍 ⇄ 已知障碍"之间切换 */
  updatePerception();
  fogDirty = true;
  actionText(perceptionOn ? '视线限制已开启:只显示小车看得见的区域(记忆区见灰)' : '已切换到上帝视角:恢复完整地图');
}));
visRRange.addEventListener('input', () => {
  visR = +visRRange.value; visRVal.textContent = visRRange.value;
  lastPerceptionCar = { x:-1e9, y:-1e9 }; /* 车静止时也按新半径重算可见区 */
});
unknownCostRange.addEventListener('input', () => {
  UNKNOWN_COST = +unknownCostRange.value; unknownCostVal.textContent = unknownCostRange.value + '×';
});
btnReplan.addEventListener('click', doReplan);
btnReset.addEventListener('click', () => {
  abortRun();
  metricsHistory = [];
  renderMetrics();
  actionText('已重置');
});
btnResetStart.addEventListener('click', () => {
  resetCarToStart();
  cam.x = start.x; cam.y = start.y;
  actionText('小车已回到起点');
});
window.addEventListener('resize', resizeCanvas);
} /* end !IS_WORKER 输入区 */

/* ============ Worker 入口(仅 Worker 线程) ============ */
if (IS_WORKER){
  let curAlgo = null, lastSamplesLen = -1;
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function checkSamples(a){
    if (a && a.samples && a.samples.length !== lastSamplesLen){
      lastSamplesLen = a.samples.length;
      vis.samples = a.samples;
    }
  }
  /* 渲染用大数组(edges/nodes/treeA/treeB/samples)长度变化时全量回传 */
  const lastBigLen = {};
  function syncBig(a){
    if (!a) return;
    const chk = (arr, name) => {
      if (arr && arr.length !== lastBigLen[name]){
        lastBigLen[name] = arr.length;
        postMessage({ type:'big', name, data: arr });
      }
    };
    chk(a.samples, 'samples');
    chk(a.edges, 'edges');
    chk(a.nodes, 'nodes');
    chk(a.treeA, 'treeA');
    chk(a.treeB, 'treeB');
  }
  let flushCount = 0;
  function flushBatch(){
    checkSamples(curAlgo);
    if (flushCount % 4 === 0) syncBig(curAlgo); /* 大数组同步节流,减克隆开销 */
    flushCount++;
    const inc = vis.__drain();
    if (!curAlgo) return;
    postMessage({ type:'batch', inc,
      expanded: curAlgo.metrics ? curAlgo.metrics.expanded : 0,
      timeMs: curAlgo.t0 ? performance.now()-curAlgo.t0 : 0,
      antsA: curAlgo.antsA ? curAlgo.antsA.map(a=>({x:a.x,y:a.y})) : null,
      antsB: curAlgo.antsB ? curAlgo.antsB.map(a=>({x:a.x,y:a.y})) : null });
  }
  function workerRun(a, deadloop){
    if (curAlgo !== a) return;
    const budgetMs = a._budgetMs || 20;
    let tickCount = 0;
    /* 死循环满载:持续预算块全速计算,不依赖 setTimeout(后台节流免疫);
       D* Lite 需处理增量重规划消息 → 周期让出 */
    while (!a.done){
      const bStart = performance.now();
      let bSteps = 0;
      while (!a.done && performance.now()-bStart < budgetMs){
        const ev = a.step();
        if (ev) for (const e of ev) if (e.type === 'info') postMessage({ type:'info', text:e.text });
        bSteps++;
        if (bSteps >= 2000){ flushBatch(); bSteps = 0; }
      }
      flushBatch();
      tickCount++;
      if (!deadloop && tickCount % 30 === 0){ setTimeout(() => workerRun(a, deadloop), 0); return; }
    }
    postMessage({ type:'done', path: a.path || [], failReason: a.failReason || '',
      metrics: a.metrics || {}, replanRun: !!a.replanRun, hasPlan: !!a.hasPlan,
      antsA: a.antsA ? a.antsA.map(x=>({x:x.x,y:x.y})) : null,
      antsB: a.antsB ? a.antsB.map(x=>({x:x.x,y:x.y})) : null,
      pheromone: a.pheromone || null });
  }
  self.onmessage = (e) => {
    const msg = e.data;
    if (msg.cmd === 'start'){
      world.obstacles = msg.obstacles;
      goal.x = msg.goal.x; goal.y = msg.goal.y;
      start.x = msg.start.x; start.y = msg.start.y; start.theta = msg.start.theta || 0;
      car.x = start.x; car.y = start.y; car.theta = start.theta || 0;
      if (msg.apfSpeed !== undefined) APF_SPEED = msg.apfSpeed;
      /* 感知模式:只保留已见障碍与已探索格;未知区可通行但按 unknownCost 加价 */
      perceptionOn = !!msg.perception;
      knownObstacles = msg.known || [];
      UNKNOWN_COST = msg.unknownCost || 4;
      grid.visited = msg.visited || null;
      grid.buildFromWorld(); /* 吸附与算法 init 都依赖网格 */
      dynamicStart = msg.dynamicStart || null;
      if (dynamicStart){
        /* 起点吸附最近自由格:防车贴障碍时重规划起点被膨胀覆盖 */
        const sc2 = nearestFreeCell(dynamicStart.x, dynamicStart.y);
        dynamicStart = { x: sc2.x*GRID+GRID/2, y: sc2.y*GRID+GRID/2, theta: dynamicStart.theta || 0 };
      }
      if (msg.seed !== undefined) Math.random = mulberry32(msg.seed);
      curAlgo = createAlgorithm(msg.algoId);
      curAlgo._budgetMs = 20 * (msg.speedMult || 1);
      lastSamplesLen = -1;
      const ok = curAlgo.init();
      postMessage({ type:'init', ok: ok !== false, failReason: curAlgo.failReason || '' });
      if (ok !== false) workerRun(curAlgo, curAlgo.id !== 'dlite');
    } else if (msg.cmd === 'replanDlite'){
      world.obstacles = msg.obstacles;
      perceptionOn = !!msg.perception;
      knownObstacles = msg.known || [];
      UNKNOWN_COST = msg.unknownCost || 4;
      grid.visited = msg.visited || null;
      grid.buildFromWorld();
      curAlgo.blockedBefore = msg.blockedBefore;
      curAlgo.replan(msg.changed);
      workerRun(curAlgo, false);
    } else if (msg.cmd === 'abort'){ curAlgo = null; }
  };
  /* 注意:这里不能写顶层 return(浏览器 <script> 非法),靠下面的 if(!IS_WORKER) 隔离主线程代码 */
}

/* ============ 初始化(仅主线程) ============ */
if (!IS_WORKER){
resizeCanvas();
generateObstacles(0.12);
grid.buildFromWorld();
resetPerception();
setupWorkers();
updateCoverDisplay();
renderMetrics(); /* 初始即显示空态提示 */
syncPlaybackUI();
syncMoveGate();
algCount.textContent = ALGORITHMS.length + ' 种';
/* 面板折叠:窄屏默认收起 */
panelToggle.addEventListener('click', () => document.body.classList.remove('panel-collapsed'));
btnCollapse.addEventListener('click', () => document.body.classList.add('panel-collapsed'));
if (window.innerWidth < 900) document.body.classList.add('panel-collapsed');
requestAnimationFrame(loop);
}
</script>
